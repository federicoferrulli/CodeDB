<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Atlante del codice · CodeDB</title>
  <style>
    :root {
      --paper: #f6f7fa;
      --surface: #fff;
      --text: #20212b;
      --muted: #596273;
      --line: #dce0e7;
      --accent: #5143bb;
      --tint: #eeebff;
      --stage: #181c2f;
      --ink: #edf0fc;
      --steel: #b9bfd5;
      --mono: "JetBrains Mono", Consolas, ui-monospace, monospace;
      --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-family: var(--sans);
      color: var(--text);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; }
    button, input, select { font: inherit; color: inherit; }
    button, select, summary { cursor: pointer; }
    button { background: none; border: 0; }
    button:disabled { opacity: .45; cursor: default; }
    :focus-visible { outline: 3px solid #816ee9; outline-offset: 3px; }
    [hidden] { display: none !important; }
    .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: middle; }
    .container { width: min(1570px, 100%); margin-inline: auto; padding-inline: clamp(16px, 3.5vw, 60px); }
    .banner { background: var(--surface); border-bottom: 1px solid var(--line); }
    .bar { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand, .header-actions, .action, .group-title, .tool, .mode, .kind, .file, .searchbox, .legend-item { display: inline-flex; align-items: center; }
    .brand { gap: 10px; padding: 0; font-size: 21px; letter-spacing: -.035em; font-weight: 700; }
    .brand img { width: 32px; height: 32px; }
    .brand-group, .header-actions { display: flex; align-items: center; gap: 12px; }
    .brand-group .divider { height: 19px; width: 1px; background: var(--line); margin: 0 3px; }
    .doc-label { font-size: 13px; color: var(--muted); }
    .action { gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 7px; font-size: 13px; font-weight: 600; text-decoration: none; }
    .action:hover { background: #eeeff4; }
    .action.primary { background: var(--accent); color: #fff; }
    .action.primary:hover { background: #3f329b; }
    .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 26px; padding-block: 34px 24px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(32px, 3.1vw, 49px); letter-spacing: -.038em; line-height: 1.06; font-weight: 650; }
    .intro p { margin-top: 10px; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .search-wrap { position: relative; min-width: 240px; width: 28%; max-width: 350px; z-index: 3; }
    .searchbox { width: 100%; height: 42px; gap: 10px; padding: 0 12px; border: 1px solid #cbd0db; background: white; border-radius: 8px; color: var(--muted); }
    .searchbox:focus-within { border-color: var(--accent); outline: 2px solid #cfc7ff; }
    .searchbox input { width: 100%; min-width: 0; border: 0; padding: 0; outline: none; background: transparent; font-size: 14px; }
    .searchbox input::placeholder { color: #636a78; }
    kbd { font: 12px var(--mono); border: 1px solid var(--line); background: #f7f8fa; border-radius: 4px; padding: 2px 6px; }
    .search-results { position: absolute; top: calc(100% + 6px); right: 0; width: max(100%, min(380px, 88vw)); max-height: 355px; overflow: auto; background: white; border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 12px 26px #24263b1c; padding: 5px; }
    .search-results button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; padding: 10px; text-align: left; border-radius: 5px; }
    .search-results button:hover, .search-results button[aria-selected=true] { background: var(--tint); }
    .search-results small { font: 11px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
    .none { padding: 12px; font-size: 14px; color: var(--muted); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(270px, 26%); gap: 18px; align-items: start; }
    .map-card { background: var(--stage); color: var(--ink); border-radius: 12px; overflow: hidden; }
    .map-head, .map-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .map-head { min-height: 58px; padding: 10px 17px; border-bottom: 1px solid #35394d; }
    .group-title { min-width: 0; gap: 10px; font-size: 14px; font-weight: 600; }
    .group-title .icon { color: #c1b3fc; }
    #crumb-label { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .modes { display: flex; flex: none; gap: 2px; padding: 3px; background: #101425; border: 1px solid #31364a; border-radius: 6px; }
    .mode { gap: 6px; padding: 5px 9px; border-radius: 4px; color: var(--steel); font-size: 12px; }
    .mode[aria-pressed=true] { color: white; background: #393e55; }
    .mode .icon { width: 14px; height: 14px; }
    .stage { position: relative; background-color: var(--stage); background-image: radial-gradient(#3a3e56 0.85px, transparent 0.9px); background-size: 18px 18px; }
    #map { display: block; width: 100%; height: clamp(408px, 33vw, 485px); }
    .map-counts { display: flex; gap: 8px; align-items: center; position: absolute; top: 14px; left: 17px; font: 11px var(--mono); color: #c2c7dc; pointer-events: none; }
    .map-counts span + span::before { content: "·"; margin-right: 8px; color: #969cb7; }
    .zoom-bar { display: flex; align-items: center; gap: 2px; position: absolute; bottom: 12px; right: 13px; background: #1e2236; border: 1px solid #42465c; padding: 2px; border-radius: 7px; }
    .tool { justify-content: center; color: var(--ink); width: 30px; height: 29px; border-radius: 4px; }
    .tool .icon { width: 15px; height: 15px; }
    .tool:hover { background: #373b53; }
    #zoom-level { min-width: 35px; text-align: center; font: 11px var(--mono); color: var(--steel); }
    #fit { border-left: 1px solid #484d62; border-radius: 0 4px 4px 0; margin-left: 3px; }
    .map-foot { min-height: 43px; border-top: 1px solid #34384e; padding: 8px 15px; flex-wrap: wrap; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; }
    .legend-item { gap: 5px; padding: 3px 0; color: #d7daeb; font-size: 12px; }
    .legend-item:hover { color: white; text-decoration: underline; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--dot, #ad98fa); }
    .root-reset { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; color: var(--steel); font-size: 12px; padding: 0; }
    .root-reset .icon { width: 14px; height: 14px; }
    .root-reset:hover { color: white; }
    .detail-jump { display: none; }
    .inspector { background: white; border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; max-height: calc(clamp(408px, 33vw, 485px) + 102px); overflow: hidden; }
    .inspector-label { display: flex; align-items: center; gap: 8px; padding: 0 18px; min-height: 47px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; color: #515a69; }
    .inspector-label .icon { width: 16px; height: 16px; }
    #detail { padding: 20px 19px; overflow: auto; scrollbar-width: thin; scrollbar-color: #c6c8d3 transparent; }
    .kind { gap: 6px; color: #5143a1; background: #f1edff; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 650; }
    .kind .icon { width: 13px; height: 13px; }
    #detail h2 { margin-top: 11px; font-size: 26px; line-height: 1.13; letter-spacing: -.032em; }
    .summary { margin-top: 9px; color: #4f5766; line-height: 1.52; font-size: 14px; }
    .detail-section { margin-top: 19px; padding-top: 15px; border-top: 1px solid #e4e6ed; }
    .detail-section h3, details summary { font-size: 13px; font-weight: 650; }
    .rules { margin: 8px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.48; color: #424a59; }
    .rules li + li { margin-top: 6px; }
    .rules li::marker { color: #8173c6; }
    .rel-link { display: flex; align-items: center; gap: 9px; text-align: left; width: 100%; min-height: 35px; border-bottom: 1px solid #eef0f4; padding: 6px 0; font-size: 13px; }
    .rel-link:hover { color: var(--accent); }
    .rel-link .icon { width: 13px; height: 13px; margin-left: auto; color: var(--muted); }
    .rel-link small { display: block; color: var(--muted); font-size: 11px; }
    .refs { margin-top: 5px; }
    .file { display: flex; gap: 7px; font: 11px/1.45 var(--mono); padding: 4px 0; text-decoration: none; color: #4b4782; overflow-wrap: anywhere; }
    .file:hover { text-decoration: underline; }
    .file .icon { width: 13px; height: 13px; }
    .file span { min-width: 0; }
    .paths { background: white; border: 1px solid var(--line); margin: 19px 0 32px; border-radius: 10px; padding: 17px 21px; }
    .paths-head { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .paths h2 { display: flex; align-items: center; gap: 9px; font-size: 18px; letter-spacing: -.025em; }
    .paths h2 .icon { color: var(--accent); width: 21px; height: 21px; }
    #route { border: 1px solid #cdd1db; border-radius: 6px; background: white; padding: 6px 9px; font-size: 13px; max-width: 100%; }
    #steps { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 7px; margin: 14px 0 0; padding: 0; list-style: none; }
    #steps li { display: flex; align-items: center; gap: 7px; }
    #steps .icon { width: 13px; height: 13px; color: #737a88; }
    .step { display: inline-flex; align-items: center; gap: 7px; min-height: 31px; padding: 2px 5px; border-radius: 4px; font-size: 13px; }
    .step:hover, .step[aria-current=true] { background: var(--tint); color: var(--accent); }
    .ordinal { display: inline-grid; place-items: center; border: 1px solid #d6d5e3; border-radius: 50%; width: 19px; height: 19px; font: 11px var(--mono); color: #5b5871; }
    #node-list { height: clamp(408px, 33vw, 485px); overflow: auto; padding: 12px 17px 20px; color: var(--ink); background: var(--stage); }
    .list-group { margin: 4px 0 14px; }
    .list-group h3 { color: #cac4e9; font-size: 13px; margin: 0 0 4px; padding: 6px 0; border-bottom: 1px solid #42445a; }
    .list-buttons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px; }
    .list-buttons button { text-align: left; padding: 8px 6px; border-radius: 4px; color: #eef0ff; font-size: 13px; }
    .list-buttons button:hover, .list-buttons button[aria-current=true] { background: #39374e; }
    .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @media (max-width: 1100px) { .workspace { grid-template-columns: minmax(0, 1fr) 265px; gap: 12px; } .container { padding-inline: 22px; } .legend { gap: 8px; } }
    @media (max-width: 890px) { .workspace { grid-template-columns: 1fr; } .inspector { max-height: none; } #detail { overflow: visible; } .intro { align-items: center; } .legend { gap: 14px; } .detail-jump { display: inline-flex; } }
    @media (max-width: 600px) {
      .container { padding-inline: 13px; }
      .bar { min-height: 55px; gap: 6px; }
      .brand { font-size: 19px; gap: 6px; }
      .brand img { width: 28px; height: 28px; }
      .doc-label, .brand-group .divider { display: none; }
      .header-actions { gap: 3px; }
      .action { min-height: 39px; padding-inline: 9px; }
      .intro { display: block; padding: 23px 0 15px; }
      h1 { font-size: 33px; }
      .intro p { margin-top: 6px; font-size: 14px; }
      .search-wrap { margin-top: 14px; width: 100%; max-width: none; min-width: 0; }
      .searchbox { height: 44px; }
      .map-head { min-height: 49px; padding: 6px 10px; gap: 5px; }
      .group-title { gap: 6px; }
      .mode { padding: 6px 7px; }
      #map, #node-list { height: 348px; }
      .map-counts { top: 10px; left: 11px; }
      .map-foot { padding-inline: 10px; gap: 6px; }
      .legend { gap: 4px 10px; }
      .root-reset { min-height: 32px; }
      .tool { width: 35px; height: 34px; }
      .inspector-label { min-height: 40px; }
      #detail { padding: 14px 16px; }
      .paths { padding: 15px; margin: 13px 0 20px; }
      .paths-head { align-items: flex-start; flex-direction: column; gap: 9px; }
      #route { width: 100%; min-height: 40px; }
      .step { min-height: 35px; }
    }
  </style>
</head>

el workbench","summary":"Browser, Electron e WebView Android presentano lo stesso workbench. I client MCP accedono alle operazioni del server tramite un protocollo distinto.","rules":["Per un gesto UI parti da public/js/main.js e dal controller della vista. Per i controlli condivisi segui gli adattatori Arc in ui/main.tsx.","Una modifica di semantica del DBMS va verificata nei percorsi che usano la stessa strategia, inclusi UI, esecuzione query e MCP."],"sources":["public/index.html","public/js/main.js","ui/main.tsx","electron-main.js","android/mobile.cjs","mcp/McpGateway.js"],"tests":["test/e2e-avvio-ui.js","test/unit-architettura-modulare.js"],"section":"repo"},"shared-modules":{"kind":"concept","title":"Moduli condivisi e compatibilità","summary":"Il server usa prevalentemente CommonJS, i controller web sono ESM. Le regole pure necessarie ai due ambienti possono avere una sola implementazione.","rules":["Per quotare gli identificatori usa la regola di public/js/identificatori.mjs e il ponte db/identificatori.js. Verifica anche il caricamento dei moduli condivisi sul runtime mobile.","Conserva nomi e forme pubbliche di eventi, metodi e payload. UI, commenti e messaggi di errore sono in italiano."],"sources":["AGENTS.md","db/identificatori.js","public/js/identificatori.mjs","android/mobile.cjs"],"tests":["test/unit-identificatori.js","android/test-moduli.cjs"],"section":"repo"},"runtime":{"kind":"section","title":"Ciclo di vita","summary":"Avvio e arresto dell’istanza, configurazione isolata e proprietà delle sessioni.","rules":[],"sources":[".github/workflows/release.yml","backup/lib/policy.js"],"tests":[],"area":"core","anchor":"avvio-e-ciclo-di-vita"},"local-development":{"kind":"concept","title":"Avvio da sorgenti","summary":"Node 24 è la linea usata dalla CI e dall’immagine Docker. npm ci installa dal lockfile. npm run dev avvia il watcher server su 127.0.0.1:3030 per impostazione iniziale.","rules":["Gli ESM in public/js/ sono serviti direttamente. Per modifiche in ui/ compila con npm run build:ui o npm run dev:ui e usa npm run typecheck:ui.","npm run start:rbac carica .env. L’attivazione dipende da CODEDB_RBAC=on e richiede il control plane MongoDB configurato."],"sources":["package.json","tools/build-ui.mjs","Dockerfile","server/identita.js",".env.example"],"tests":["test/e2e-avvio-ui.js"],"section":"runtime"},"instance-config":{"kind":"concept","title":"Configurazione e isolamento","summary":"createServer({config, dependencies}) compone servizi per istanza. configurazione() fotografa l’ambiente, applica gli override e valida porta e URL pubblico.","rules":["Per una fixture usa PORT: 0 o una porta dedicata. Definisci percorsi distinti per INI/vault, connessioni per owner, backup, risultati script, log UI/MCP e impostazioni MCP.","Se RBAC è attivo isola anche il control plane. L’isolamento delle mappe e dei lock in memoria lascia indipendente la scelta di dove scrivere su disco."],"sources":["server/createServer.js","server/configurazione.js","server/dipendenze.js","docs/server-modulare.md"],"tests":["test/unit-server-modulare.js"],"section":"runtime"},"server-lifecycle":{"kind":"concept","title":"Avvio e arresto del server","summary":"Importare la facciata server.js è privo di ascolto su porte. start() inizializza rete, vault e identità. stop() drena il lavoro per istanza e rilascia le risorse.","rules":["Attendi start() prima di usare la porta. In caso di avvio fallito si rilasciano anche le risorse parzialmente inizializzate.","stop() è idempotente. Per riavviare costruisci una nuova istanza. I segnali e la terminazione del processo appartengono al launcher CLI."],"sources":["server.js","server/createServer.js","server/processo.js","bin/codedb.js"],"tests":["test/unit-server-modulare.js"],"section":"runtime"},"session-ownership":{"kind":"concept","title":"Proprietà delle sessioni e lease","summary":"Il socket conserva una Map per tabId con strategia, eventuale tunnel e operazioni in corso. Le sessioni vive usano la quota di connessioni DB condivisa con MCP.","rules":["mongo:connect e mongo:disconnect gestiscono tutti i motori. Serializza sullo stesso lock apertura e chiusura di un tab. Rilascia anche una connessione appena aperta se nel frattempo il client è scomparso.","Dopo una caduta del trasporto la pagina ha dieci minuti per ritrovare le sessioni con la propria chiave in memoria e lo stesso login. session:recovery ne conferma la continuità. Scadenza, revoca e chiusura esplicita rilasciano le sessioni.","Le operazioni che usano una lease, come uml:apply, la acquisiscono sul bersaglio e la rilasciano in finally. La chiusura differisce il teardown delle risorse ancora in uso."],"sources":["server/socket.js","server/eventi-connessioni.js","public/js/socket.js","public/js/connection.js","server/connessioni.js","server/eventi-dati.js","server/budget.js"],"tests":["test/unit-server-modulare.js","test/e2e-chiusura-query.js","test/e2e-ripresa-query.js"],"section":"runtime"},"transport":{"kind":"section","title":"Trasporto","summary":"Un comando dalla UI arriva al socket, attraversa autorizzazione e strategia e torna al documento di origine.","rules":[],"sources":["server/connessioni.js","server/eventi-connessioni.js"],"tests":[],"area":"core","anchor":"dal-clic-alla-risposta"},"event-families":{"kind":"concept","title":"Famiglie di eventi Socket.IO","summary":"Le azioni sui dati passano da delegate, quelle amministrative da amministrativo e quelle lunghe da operazioneLunga. safeOn gestisce validazione, rivalidazione, errori e ack monouso.","rules":["Per una nuova azione sui dati classifica evento e metodo, recupera il bersaglio e restituisci il risultato della strategia. Per un’azione amministrativa dichiara la politica di audit e verifica il permesso nell’handler.","Per un’operazione lunga dichiara proprietà, avanzamento, cancellazione e termine. Aggiorna il catalogo degli eventi insieme alla registrazione. Alcune eccezioni usano safeOn direttamente."],"sources":["server/socket.js","server/eventi-dati.js","server/audit.js","auth/capabilities.js","docs/adr/0001-tre-famiglie-di-evento.md"],"tests":["test/unit-registrazione-eventi.js","test/server-eventi-attesi.json"],"section":"transport"},"socket-request":{"kind":"concept","title":"Richiesta, ack e tab di origine","summary":"emit() fissa il tabId alla partenza e associa _tab e _state alla risposta. Un tabId esplicito ha precedenza. Gli ack ordinari contengono ok e dati oppure ok:false ed error.","rules":["Scrivi sullo stato originario. Prima di ridisegnare verifica anche documento, bersaglio e identità della richiesta. Il solo tab attivo non distingue due ricerche consecutive nella stessa scheda.","Per richieste normali la chiusura del tab genera AbortError/TAB_CLOSED. bindTab:false è previsto per operazioni registrate con durata indipendente dal tab. Progresso e notifiche sono eventi push."],"sources":["public/js/trasporto.js","public/js/coerenza-richieste.js","server/socket.js","db/payloadEsecuzione.js"],"tests":["test/unit-trasporto.js","test/unit-coerenza-richieste.js","test/e2e-pagine-obsolete.js"],"section":"transport"},"grid-page":{"kind":"concept","title":"Lettura paginata e conteggio differito","summary":"runQuery() congela database, collezione, filtro e pagina. collection:find con deferCount restituisce subito le righe. collection:count usa poi lo stesso filtro.","rules":["Conserva le righe se scade il conteggio. total:null e timedOut:true significano totale sconosciuto. Distingui nella UI stima, totale esatto, conteggio pendente e timeout.","Le azioni massive e la fine della paginazione dipendono dall’affidabilità del totale. Una risposta di conteggio precedente non può aggiornare una ricerca successiva."],"sources":["public/js/grid.js","public/js/coerenza-richieste.js","server/eventi-dati.js","db/tetti.js"],"tests":["test/unit-tetti.js","test/e2e-pagine-obsolete.js"],"section":"transport"},"cell-write":{"kind":"concept","title":"Salvataggio di una cella","summary":"salvaCampi() invia doc:update con tabId, db, coll, idOf(doc) e set catturati dal contesto dell’editor. Il percorso di scrittura è riusato da griglia, geometrie e selettore FK.","rules":["Alla conferma dell’input inline elimina solo le bozze immutate dall’invio. Se l’utente ha cambiato vista, marca i dati originali da aggiornare o passa il refresh alla callback della vista.","Su un errore di validazione conserva l’input correggibile. Usa l’identità della risposta DB per la riga e i metadati delle colonne per l’editabilità."],"sources":["public/js/inlineEdit.js","public/js/righe.js","server/eventi-dati.js"],"tests":["test/e2e-arc-griglia.js","test/e2e-sql-integrita-ui.js"],"section":"transport"},"errors":{"kind":"section","title":"Errori","summary":"Traduzione degli errori dei driver, posizioni nell’editor e distinzione tra errore certo ed esito sconosciuto.","rules":[],"sources":[],"tests":[],"area":"core","anchor":"errori-e-diagnosi"},"driver-diagnosis":{"kind":"concept","title":"Errori del driver e messaggi italiani","summary":"errMsg() inoltra errore e contesto a spiegaErrore(). descriviErrore() riconosce, fra gli altri, codici del driver, SQLSTATE, errori di rete e di vincolo.","rules":["Propaga l’errore con codice e posizione. Il delegato può aggiungere err._ctx con dbType, db e coll. Per una diagnosi riconosciuta presenta causa, rimedio e dettaglio tecnico utile.","Per un messaggio sconosciuto conserva il testo depurato. redigiUri() oscura componenti riservate anche nel fallback. Testa l’idempotenza e il caso vicino che deve restare sconosciuto."],"sources":["server/errori.js","db/errors.js","server/socket.js","public/js/avvisi.js"],"tests":["test/unit-errors.js","test/unit-feedback-messaggi.js"],"section":"errors"},"query-error-range":{"kind":"concept","title":"Posizione degli errori nell’editor","summary":"queryError rappresenta un intervallo UTF-16 da zero, con fine esclusa. Il server e il browser usano la stessa regola per le posizioni supportate.","rules":["Converti i caratteri PostgreSQL contati da uno e nel caso di script riporta l’intervallo al documento originale. Verifica anche righe successive e un emoji precedente al token.","Se manca una posizione esplicita, evidenzia solo un frammento riconoscibile e univoco. Per un token ambiguo resta valido il messaggio senza evidenziazione."],"sources":["public/js/query-error.js","db/queryError.js","server/query.js","server/socket.js"],"tests":["test/unit-query-error.js","test/e2e-query-error-mark.js"],"section":"errors"},"uncertain-outcome":{"kind":"concept","title":"Riconnessione ed esito incerto","summary":"Una sessione dichiarata assente e una connessione caduta durante un comando hanno conseguenze diverse. executeWithReconnect() può ristabilire la sessione lasciando incerto l’esito precedente.","rules":["Se il server segnala assenza di sessione e il profilo è salvato, emit() può riconnettere per nome e ritentare una volta.","Se cade la connessione durante una scrittura, conserva il segnale operationOutcomeUnknown dove disponibile. Verifica i dati o il registro prima di ripetere. Una nuova connessione SQL perde lo stato transazionale della precedente."],"sources":["server/connessioni.js","public/js/trasporto.js","db/sqlSessione.js"],"tests":["test/unit-trasporto.js","test/unit-sql-sessioni.js"],"section":"errors"},"partial-failure":{"kind":"concept","title":"Fallback ed esiti parziali","summary":"Il recupero dipende dal lavoro già effettuato. Calcoli locali equivalenti possono sostituire un worker guasto. La verifica fallita dopo una promozione richiede un esito e il recupero.","rules":["Distingui indisponibilità dei metadati da zero relazioni e timeout da zero righe. Un ack iniziale in un’operazione lunga attesta accettazione, non completamento.","Su un import incompleto conserva fase, effetti e recupero. Se la copia originale non può essere verificata come ripristinata, riporta l’intervento richiesto."],"sources":["db/importPlan.js","public/js/calcoli.js","public/js/fk-cache.js"],"tests":["test/unit-import-conferma.js","test/unit-calcoli.js"],"section":"errors"},"strategies":{"kind":"section","title":"Strategie e tipi","summary":"Differenze fra DBMS, identità stabile e rappresentazioni esatte nei percorsi di lettura e scrittura.","rules":[],"sources":["db/MongoDbStrategy.js","db/MySqlStrategy.js","db/PostgreSqlStrategy.js"],"tests":[],"area":"data","anchor":"strategie-identità-e-tipi"},"guarded-strategy":{"kind":"concept","title":"Strategie, limiti e autorizzazione","summary":"DbFactory.getStrategy() crea MongoDbStrategy, MySqlStrategy o PostgreSqlStrategy e applica conTetti(). Il livello di connessione aggiunge guardStrategy per le operazioni della sessione.","rules":["Il tipo assente nelle connessioni storiche significa mongodb. postgres è alias di postgresql. Conserva nella classe comune soltanto le operazioni condivise.","I sottosistemi specifici si montano con definisciMetodi() sul prototipo del proprio motore. Mantieni i descrittori di classe e classifica ogni nuovo metodo pubblico nella tabella delle capability."],"sources":["db/DbFactory.js","db/DbStrategy.js","db/tetti.js","db/prototipoStrategia.js","server/connessioni.js","auth/guardStrategy.js"],"tests":["test/unit-architettura-modulare.js","test/unit-tabella-autorizzazioni.js","test/unit-tetti.js"],"section":"strategies"},"typed-filter":{"kind":"concept","title":"Filtri, identificatori e ricerca","summary":"I valori sono parametri del driver. Gli identificatori di schema, tabella e colonna seguono la quotatura del dialetto. I filtri strutturati hanno condizioni, operatore, valore e unione.","rules":["Invia contieneOvunque come intenzione. La strategia ricerca valori scalari nei campi rilevati, anche annidati e fuori dalla pagina visibile.","Su MongoDB un campo raro entra nel catalogo dopo osservazione o campionamento. Su PostgreSQL quotare il nome preserva maiuscole e minuscole."],"sources":["db/filtro.js","db/ricercaGlobale.js","public/js/identificatori.mjs","docs/adr/0002-la-ricerca-globale-appartiene-alle-strategie.md"],"tests":["test/unit-filtro.js","test/unit-identificatori.js","test/unit-ricerca-globale.js"],"section":"strategies"},"row-identity":{"kind":"concept","title":"Identità stabile di documenti e righe","summary":"preparaRighe() associa con WeakMap rowIds e columnMeta agli oggetti dei risultati. La chiave per aggiornare una riga può differire da una colonna visualizzata chiamata _id.","rules":["In SQL conserva tutti i componenti della PK. Escludi le colonne generate dalle scritture. Per i documenti MongoDB il riferimento è _id tipizzato.","Per delta e merge del backup scegli l’identità stabile dichiarata: _id MongoDB, PK o vincolo univoco interamente non nullo su SQL."],"sources":["public/js/righe.js","backup/lib/identity.js","public/js/inlineEdit.js","db/sqlTabellare.js"],"tests":["test/unit-sql-integrita-righe.js","test/e2e-sql-integrita-ui.js"],"section":"strategies"},"exact-values":{"kind":"concept","title":"Precisione BSON, EJSON e SQL","summary":"serializza() mantiene il wrapper $numberLong per un BSON Long fuori dall’intervallo Number sicuro. Le conversioni SQL usano i metadati per numeri esatti e binari.","rules":["Segui il tipo da DB a UI, editor, copia, scrittura e ripristino. Prova 9007199254740993, decimali, byte binari e la precisione delle date con una rilettura indipendente.","Campo assente, null, false e stringa vuota producono effetti distinti. Nel formatter JSON/BSON preserva i token originali per conservare precisione e sintassi shell."],"sources":["db/mongoEjson.js","db/sqlValori.js","db/insertValues.js","public/js/valori-esatti.js","public/js/json-bson.js","docs/matrice-fedelta-export-import.md"],"tests":["test/unit-valori-esatti.js","test/unit-sql-valori-esatti.js","test/unit-transfer-types.js","test/unit-json-bson.js"],"section":"strategies"},"spatial-types":{"kind":"concept","title":"Geometrie e riferimento spaziale","summary":"GeoJSON alimenta le viste cartografiche. MySQL spatial, PostGIS geometry/geography e i tipi geometrici nativi PostgreSQL usano conversioni specifiche.","rules":["modificaConSrid() legge il riferimento originale sotto lock nella transazione quando necessario. Se il riferimento è ambiguo, espone un errore prima di reinterpretare le coordinate.","Per una modifica o un trasferimento verifica separatamente coordinate e SRID nel database destinatario."],"sources":["db/geometry.js","db/sridModifica.js","db/pg-geo-nativo.js","public/js/geomap.js"],"tests":["test/unit-geometry.js","test/e2e-srid-modifiche.js"],"section":"strategies"},"queries":{"kind":"section","title":"Query e script","summary":"Esecuzione sul bersaglio, scelta dell’interprete, transazioni, limiti e annullamento dei run.","rules":[],"sources":["auth/capabilities.js","server/eventi-monitoraggio.js"],"tests":["test/e2e-sessions.js"],"area":"data","anchor":"query-script-e-annullamento"},"query-dispatch":{"kind":"concept","title":"Esecuzione e annullamento","summary":"query:execute passa dal contesto costruito sul server a executeQueryCode(). La sessione sceglie il bersaglio, runId e opHandle individuano il lavoro annullabile.","rules":["Registra l’handle nella sessione di origine e rimuovilo in finally, anche dopo un cambio di tab.","Una query recuperabile lega runId e dbSessionId alla sessione originale. Se cade il socket, query:state restituisce l’esito della stessa esecuzione. Il browser ne conferma la ricezione per liberarlo.","Anche una singola istruzione dell’editor può arrivare tramite script:upload. query:execute la ricompone nella sessione SQL del tab dopo il controllo del runId.","Una query libera accetta un LIMIT esplicito e segnala un errore se supera il budget di byte. La griglia può restituire truncated.","I limiti iniziali sono 32 MiB per il risultato e 30/120/5 secondi per find/aggregate/count. La scadenza del watchdog da sola non dimostra che il DBMS abbia fermato il lavoro."],"sources":["server/query.js","server/eventi-script.js","public/js/script-upload.js","public/js/trasporto.js","db/payloadEsecuzione.js","db/tetti.js","db/DbStrategy.js"],"tests":["test/unit-query-senza-limite.js","test/unit-tetti.js","test/e2e-query-cancel.js","test/e2e-ripresa-query.js"],"section":"queries"},"native-sql-session":{"kind":"concept","title":"Sessioni SQL native","summary":"MySQL e PostgreSQL interpretano il testo tramite il proprio driver. Lo stato SQL dura tra esecuzioni singole dello stesso tab di connessione.","rules":["Serializza le istruzioni sullo stesso contesto per conservare transazioni, variabili e tabelle temporanee. Lo script usa un proprio contesto.","I blocchi di un file condividono sessione e database scelto con USE. Un errore recuperabile lascia raggiungibile il COMMIT esplicito. In una transazione PostgreSQL il runner isola con savepoint le istruzioni ordinarie del file. La perdita della transazione interrompe la sequenza.","Conserva il comportamento del dialetto e il bersaglio scelto anche dopo comandi di sessione o rollback. Alla perdita della connessione lo stato transazionale precedente va considerato perso."],"sources":["db/sqlSessione.js","server/query.js","db/mysqlSessioneNativa.js","docs/sql-nativo.md"],"tests":["test/unit-sql-sessioni.js","test/e2e-sql-native-sessioni.js","test/e2e-preproduzione.js"],"section":"queries"},"mongo-query-languages":{"kind":"concept","title":"MQL, shell e SQL su MongoDB","summary":"Una connessione MongoDB gestisce filtri, pipeline, sintassi db.collezione e SQL tradotto da SqlToMql. La copertura SQL dipende dalle operazioni implementate nel traduttore e nel runtime.","rules":["Conserva i valori BSON tipizzati durante la traduzione. Classifica lettura o scrittura dall’effetto reale della pipeline.","Estendi insieme parser, runtime, catalogo di completamento e casi di prova. Il selettore di motore deve corrispondere alla connessione effettiva."],"sources":["db/MongoShell.js","db/SqlToMql.js","db/MongoSqlRuntime.js","server/query.js","docs/copertura-linguaggi-query.md"],"tests":["test/mongo-shell.js","test/unit-sql-mongo-runtime.js","test/e2e-query-languages.js"],"section":"queries"},"mongo-script-interpreter":{"kind":"concept","title":"Interprete MongoScript","summary":"MongoScript analizza il JavaScript supportato in un AST. MongoScriptRunner lo valuta nel processo del server e accede al DB tramite un host legato alla strategia autorizzata.","rules":["Fai passare ogni nuova operazione sul database attraverso l’host.","Conserva le quote di passi, iterazioni, ricorsione, tempo, chiamate al DB e output. Il superamento di un budget deve interrompere il run."],"sources":["db/MongoScript.js","db/MongoScriptRunner.js","server/query.js"],"tests":["test/unit-mongo-script.js","test/e2e-mongo-script.js"],"section":"queries"},"mongosh-process":{"kind":"concept","title":"Runtime mongosh esplicito","summary":"Il motore mongosh crea un processo figlio per la sessione MongoDB. Conserva variabili e change stream tra richieste e può accedere a Node e al filesystem del server.","rules":["Autorizza la creazione con isInstallAdmin. Il permesso di scrittura sul database da solo è insufficiente.","Reset, timeout o arresto del processo chiudono anche variabili, richieste e stream di quel runtime."],"sources":["db/mongoshRuntime.js","db/mongoshProcesso.cjs","server/query.js"],"tests":["test/unit-mongosh.js","test/e2e-mongosh-runtime.js"],"section":"queries"},"virtual-join":{"kind":"concept","title":"Virtual JOIN tra connessioni","summary":"VirtualJoinEngine risolve due sorgenti aperte di sola lettura, legge le chiavi dalla prima, interroga la seconda e unisce in memoria.","rules":["Applica scope e limiti a entrambe le sorgenti. Un riferimento ambiguo alla connessione richiede un bersaglio esplicito.","Per confrontare le chiavi normalizza i valori. Per interrogare MongoDB conserva il tipo EJSON nel filtro $in, per SQL passa le chiavi normalizzate come parametri."],"sources":["db/VirtualJoinEngine.js","server/query.js"],"tests":["test/unit.js","test/e2e-query-engine.js"],"section":"queries"},"script-runs":{"kind":"concept","title":"Run e risultati degli script","summary":"Il client sceglie il runId di script:execute. L’ack identifica il run accettato, script:progress aggiorna il client e script:state ne restituisce lo stato.","rules":["Dividi SQL con le regole del dialetto, rispettando blocchi, stringhe e commenti. Il JavaScript gestito arriva intero all’interprete.","ScriptRunner prosegue dopo un errore per impostazione predefinita. stopOnError cambia la politica di arresto.","L’editor indicizza i file SQL su richiesta e conserva gli offset in byte. Per un’istruzione che supera il singolo messaggio socket, script:upload raccoglie i frammenti nella sessione e script:execute consuma il testo completo una volta. Il limite per istruzione è 64 MiB.","L’apertura mostra il blocco in lettura e l’invio frammentato mostra i byte confermati dal server. La ripresa riutilizza runId, upload e sessione del database. script:state restituisce anche il risultato terminale perso durante la disconnessione.","Il registro conserva un’anteprima e l’intervallo nel file originale. In pausa il blocco attende ripresa o annullamento. Alla fine di una sequenza, lo stato indica se il database ha annullato la transazione rimasta aperta.","script:result legge dal deposito su disco i risultati e gli errori conservati entro i limiti del run. I riepiloghi di scrittura restano nel resoconto. Se il deposito non si apre, lo script può proseguire."],"sources":["server/eventi-script.js","db/ScriptRunner.js","db/ScriptResults.js","public/js/sql-chunker.js","public/js/sql-chunker-worker.js","public/js/sql-split.js","public/js/sql-file-limits.mjs","public/js/script-upload.js","public/js/script-run.js","public/js/query-tab.js","public/js/pending-queries.js","db/importUploads.js","db/sqlText.js"],"tests":["test/unit-script-runner.js","test/unit-script-results.js","test/e2e-script-risultati.js","test/unit-operazioni-lunghe.js","test/unit-sql-chunking.js","test/e2e-import-upload-ui.js","test/e2e-workbench.js","test/e2e-file-sql.js","test/e2e-ripresa-query.js"],"section":"queries"},"security":{"kind":"section","title":"Identità e accessi","summary":"Permessi per tenant, connessione e bersaglio. Protezione dei segreti, verifica dell’host e traccia delle operazioni.","rules":[],"sources":[],"tests":[],"area":"ops","anchor":"autorizzazioni-vault-e-audit"},"rbac-principal":{"kind":"concept","title":"Identità e grant RBAC","summary":"Con CODEDB_RBAC=on il control plane MongoDB conserva utenti, ruoli, grant, API key e hash dei token. POST /auth/login restituisce il token opaco dell’handshake Socket.IO.","rules":["Rivalida il principal sulle connessioni attive dopo variazioni di ruolo, scope o revoche. L’eventuale scope della API key restringe le connessioni raggiungibili.","Scegli canWholeConnection per lavori nativi che coinvolgono tutta la connessione, canAdminTenant per il tenant e isInstallAdmin per risorse condivise dell’installazione."],"sources":["server/identita.js","auth/AppStore.js","auth/sessions.js","auth/principal.js","auth/permissions.js","server/eventi-backup.js"],"tests":["test/unit-rbac.js","test/e2e-rbac.js","test/e2e-rbac-mcp.js"],"section":"security"},"strategy-authorization":{"kind":"concept","title":"Capability di eventi e strategie","summary":"EVENT_CAPABILITY controlla la richiesta socket. guardStrategy applica METHOD_CAPABILITY alla strategia anche per query, JOIN e strumenti MCP.","rules":["Classifica ciascun nuovo metodo pubblico e verifica sia il permesso sul bersaglio sia la categoria dell’operazione.","Esercita un principal ammesso e uno fuori scope. Nel caso di accesso nativo al driver, verifica esplicitamente il permesso sull’intera connessione."],"sources":["auth/capabilities.js","auth/guardStrategy.js","auth/permissions.js","server/socket.js"],"tests":["test/unit-tabella-autorizzazioni.js","test/e2e-rbac.js","test/e2e-rbac-mcp.js"],"section":"security"},"sql-scope":{"kind":"concept","title":"Scope di query e clausole SQL","summary":"I riferimenti citati nell’istruzione determinano i bersagli della query SQL libera. I filtri e gli ordinamenti dei sottoutenti con scope vengono verificati come dati strutturati.","rules":["Verifica tutte le tabelle pertinenti, comprese le sorgenti annidate. Il nome nominale della tabella nella richiesta serve solo come parte del contesto.","Per le letture protette combina i controlli sull’istruzione con READ ONLY sul DBMS dove previsto. L’I/O di file richiede un controllo distinto."],"sources":["auth/sqlTables.js","auth/sqlClause.js","auth/capabilities.js","auth/guardStrategy.js"],"tests":["test/unit-filtro-autorizzazione.js","test/unit-rbac.js","test/e2e-rbac.js"],"section":"security"},"vault-secrets":{"kind":"concept","title":"Vault e connessioni salvate","summary":"Nel vault v2 una DEK casuale cifra i segreti con AES-256-GCM. La passphrase deriva con scrypt una KEK che protegge la DEK registrata in vault.json.","rules":["Il cambio di passphrase riavvolge la DEK. Conserva la lettura del formato v1, migrazione, sblocco, reset e indicazione dello stato senza cifratura.","Quando aggiungi una credenziale aggiorna SECRET_FIELDS, salvataggio, export/import e lettore CLI. URI e materiale SSH possono contenere segreti.","Gli INI RBAC sono per owner. Il browser riapre per nome con {saved: nome}, la CLI di backup legge il deposito e usa le stesse primitive."],"sources":["db/vault.js","server/vault.js","backup/lib/connstore.js","public/js/session-restore.js"],"tests":["test/unit-vault.js","test/unit-conn-config.js","test/e2e-vault-passphrase.js"],"section":"security"},"ssh-pinning":{"kind":"concept","title":"Host key e tunnel SSH","summary":"L’apertura della connessione DB può acquisire un tunnel SSH. Il pin della chiave host appartiene alla configurazione della connessione.","rules":["Verifica il pin prima delle credenziali. Per una connessione salvata il primo pin può essere persistito, per gli altri casi può servire approvare l’impronta. La modalità strict richiede un pin già configurato.","Se l’apertura del DB fallisce, rilascia anche il tunnel e la strategia parzialmente inizializzata."],"sources":["server/connessioni.js","db/SshTunnel.js","db/SshKey.js"],"tests":["test/unit-ssh-pinning.js","test/e2e-ssh-impronta.js","test/e2e-ssh-forward.js"],"section":"security"},"activity-audit":{"kind":"concept","title":"Audit delle azioni UI e MCP","summary":"L’audit annota attore, tenant, bersaglio, categoria, esito e conteggi pertinenti. UI e MCP hanno file separati, con rotazione e flush.","rules":["Usa auditActor() per mantenere il filtro ownerId/userId. Classifica l’effetto effettivo anche in caso di errore.","Distingui attività esplicita, refresh automatici e progressi di run. Registra i dettagli previsti dall’evento e redigi credenziali e URI."],"sources":["server/audit.js","db/AuditLog.js","mcp/Activity.js","db/errors.js"],"tests":["test/unit-audit-serializzato.js","test/unit-query-audit.js","test/e2e-query-audit.js"],"section":"security"},"frontend":{"kind":"section","title":"Stato e controlli","summary":"Proprietà dello stato tra tab, documento e pannello, controlli Arc e ciclo di vita dell’interazione.","rules":[],"sources":[],"tests":[],"area":"client","anchor":"stato-del-frontend-e-controlli"},"workspace-state":{"kind":"concept","title":"Tab, schede e documenti Query","summary":"Il tab di connessione possiede lo stato. Il proxy state segue il tab attivo. Le schede interne e i documenti Query mantengono snapshot, testo, esecuzione e risultati propri.","rules":["Salva gli input al cambio di contesto. Per risposte asincrone scrivi nello stato catturato all’invio e verifica identità e richiesta corrente prima del rendering.","Prova documenti concorrenti anche nella stessa connessione. Un tab ancora esistente non basta a identificare la scheda o il filtro originario."],"sources":["public/js/tabs.js","public/js/state.js","public/js/colltabs.js","public/js/query-document.js","public/js/workspace.js","public/js/coerenza-richieste.js"],"tests":["test/unit-coerenza-richieste.js","test/e2e-pagine-obsolete.js","test/e2e-chiusura-query.js"],"section":"frontend"},"browser-persistence":{"kind":"concept","title":"Ripristino e cronologia nel browser","summary":"Il layout recuperabile usa sessionStorage e riapre le connessioni salvate per nome. La cronologia Query usa localStorage, mentre le esecuzioni in sospeso hanno un registro in sessionStorage.","rules":["Il logout pulisce la cronologia. Dopo un refresh il registro delle query in sospeso marca come disconnessi i run che risultavano attivi.","Ripristina gli ID di tab e gestisci connessioni non più disponibili. I documenti UML usano IndexedDB con ambito utente/connessione/database e revisione di salvataggio."],"sources":["public/js/session-restore.js","public/js/query-history-store.js","public/js/pending-queries.js","public/js/auth.js","public/js/uml-store.js"],"tests":["test/e2e-session-restore-feedback.js","test/unit-query-history.js","test/pending-queries.js","test/e2e-uml-scenari.js"],"section":"frontend"},"split-panes":{"kind":"concept","title":"Stato e ciclo di vita dei pannelli","summary":"split-layout modella l’albero dei pannelli. splitview compone le viste e creaRuntimePane collega il workbench di un iframe al socket del padre fissando tabId e watchId.","rules":["La vista può nascondere un pannello mantenendone il runtime. Quando il pannello viene rimosso o sostituito, dispose() rilascia listener, osservazioni e run propri.","Preserva il bersaglio originario delle richieste. Prova due tabelle visibili e la chiusura di un riquadro con ack in volo."],"sources":["public/js/split-layout.js","public/js/splitview.js","public/js/pane-runtime.js"],"tests":["test/unit-split-layout.js","test/e2e-split-bersaglio-riquadro.js","test/e2e-split-completa.js"],"section":"frontend"},"arc-controls":{"kind":"concept","title":"Controller vanilla e componenti Arc","summary":"I controller ESM in public/js lavorano con controlli React/TypeScript in ui/. Esbuild genera i bundle JS e CSS in public/arc/ per browser, Electron e Android.","rules":["Modifica i sorgenti in ui/ e rigenera con npm run build:ui. initControls() monta i controlli prima dei listener vanilla.","Preserva ID, label, form.elements, validazione, valore, disabled e reset dei modelli DOM. Le modifiche programmatiche sincronizzano il controllo senza simulare un gesto utente."],"sources":["ui/main.tsx","ui/controls.tsx","ui/fields.tsx","public/js/main.js","tools/build-ui.mjs"],"tests":["test/e2e-arc-campi.js","test/e2e-arc-griglia.js"],"section":"frontend"},"dialog-feedback":{"kind":"concept","title":"Dialoghi, focus e feedback","summary":"I dialoghi Arc riutilizzano il pannello del form. Il controller sceglie l’avviso in base a campo, vista e azione, conservando il contesto dell’errore.","rules":["Controlla focus iniziale e di ritorno, Escape con popup annidato, Enter, annullamento e un solo invio anche al doppio clic.","Usa informazioni brevi per i successi, feedback contestuale per i dati correggibili e avviso persistente per una decisione. Conserva bozza e dettaglio tecnico.","Le notifiche globali restano sovrapposte al workspace. Usa l’altezza del messaggio per lasciare raggiungibile con lo scorrimento l’ultima riga, anche a dettagli aperti."],"sources":["ui/dialogs.tsx","ui/notifiche.tsx","public/css/arc-theme.css","public/js/avvisi.js","public/js/utils.js"],"tests":["test/e2e-dialog-lifecycle.js","test/e2e-feedback-contesto.js","test/e2e-connection-feedback.js","test/e2e-uscita-editing.js"],"section":"frontend"},"theme-accessibility":{"kind":"concept","title":"Tema, viewport e interazioni accessibili","summary":"I token CSS condivisi e il ponte Arc descrivono colori e stati. index.html applica il tema prima dei moduli per mantenere stabile il primo rendering.","rules":["Verifica chiaro, scuro e personalizzato, contrasto, focus, tastiera e movimento ridotto. Su mobile usa il viewport utile e le aree sicure.","Per maniglie e separatori includi puntatore e tastiera. Navigator, sidebar ed editor usano maniglia.js, i divisori Split-View vivono in splitview.js."],"sources":["public/css/tokens.css","public/css/arc-theme.css","public/js/theme.js","public/index.html","public/js/viewport.js","public/js/maniglia.js"],"tests":["test/unit-tema.js","test/e2e-maniglie-tocco.js","test/e2e-tema-navigatore.js"],"section":"frontend"},"workspace":{"kind":"section","title":"Viste del workspace","summary":"Griglia, cataloghi, editor, grafici, mappe, diagrammi e monitoraggio del DBMS.","rules":[],"sources":[],"tests":[],"area":"client","anchor":"strumenti-del-workspace"},"data-grid":{"kind":"concept","title":"Griglia, selezione e modifiche","summary":"Il renderer virtualizza righe visibili e margine. Il modello conserva l’intera selezione e i metadati necessari a scrivere sul bersaglio originale.","rules":["Copia/incolla e statistiche devono includere le celle selezionate fuori dal DOM. Conserva le rappresentazioni esatte dei valori.","Per modificare o inserire rispetta identità della riga, metadati del campo e destinazione catturata. Prova le stesse azioni nel pannello split."],"sources":["public/js/griglia.js","public/js/grid.js","public/js/righe.js","public/js/cellselect.js","public/js/inlineEdit.js","public/js/insert.js"],"tests":["test/unit-griglia.js","test/e2e-selezione-celle-viste.js","test/e2e-arc-griglia.js"],"section":"workspace"},"schema-catalog":{"kind":"concept","title":"Catalogo progressivo, indici e relazioni","summary":"db:schema in modalità progressiva pagina oggetti, campi e relazioni in modo indipendente. Le viste Dettagli e FK consumano i metadati del database.","rules":["Lo snapshot è per sessione, database e impronta dei permessi. Se cambia la revisione durante la paginazione, riparti da una revisione coerente.","Il delegate invalida lo snapshot dopo un proprio evento ddl riuscito. Per SQL libero, script o modifiche esterne rileggi esplicitamente o alla scadenza.","Distingui zero FK da una lettura fallita. Per una FK composta conserva ordine e insieme dei campi nell’aggiornamento."],"sources":["db/schemaProgressivo.js","db/schemaSnapshot.js","server/eventi-dati.js","public/js/details.js","public/js/fk-cache.js","public/js/schema-ops.js"],"tests":["test/unit-schema-progressivo.js","test/unit-fk-relazioni.js","test/e2e-fk-inserimento.js"],"section":"workspace"},"editor-navigation":{"kind":"concept","title":"Editor, IntelliSense e scorciatoie","summary":"IntelliSense legge l’istruzione al cursore, risolve sorgenti, alias e vocabolario del dialetto. Palette, editor e snippet usano il contesto del documento e il catalogo delle scorciatoie.","rules":["Riconosci SQL anche su una connessione MongoDB. Dopo FROM/JOIN proponi sorgenti, dopo un alias le colonne pertinenti. Quota gli identificatori secondo il motore.","autocomplete.js conserva lo schema per tab e database. Le operazioni DDL della UI e schema:changed invalidano la cache.","Le azioni globali passano dalla palette, quelle locali dagli editor. Con RBAC le preferenze dei tasti usano il control plane, in modalità locale lo storage del browser."],"sources":["public/js/query-editor.js","public/js/intellisense.js","public/js/autocomplete.js","public/js/sql-dialetti.js","public/js/scorciatoie.js","public/js/palette.js","public/js/snippet-manager.js"],"tests":["test/unit-intellisense.js","test/e2e-richieste-intellisense.js","test/e2e-scorciatoie.js"],"section":"workspace"},"selection-analytics":{"kind":"concept","title":"Statistiche, worker e grafici","summary":"Le statistiche della selezione e la costruzione delle serie ECharts operano sui valori del modello. Il costo della copia dei dati determina quali calcoli spostare su un worker.","rules":["A partire da 50.000 celle le statistiche possono inviare al module worker i valori selezionati. Worker e ripiego locale usano eseguiCompito().","Scansione dei campi, precalcolo dei grafici e disegno rimangono sul thread chiamante. sequenziatore() scarta risposte obsolete durante richieste ravvicinate."],"sources":["public/js/cell-stats.js","public/js/cell-chart.js","public/js/calcoli.js","public/js/calcoli-protocollo.js","public/js/chart-option.js","public/js/chart-runtime.js"],"tests":["test/unit-calcoli.js","test/unit-cell-chart.js"],"section":"workspace"},"geospatial-views":{"kind":"concept","title":"Mappe di risultati e selezioni","summary":"geo-risultati riconosce GeoJSON nelle righe, nei sottodocumenti e negli array entro limiti espliciti. geo-vista disegna sia la mappa Query sia quella della selezione.","rules":["Mantieni layer, selezione e smontaggio indipendenti per ogni istanza. La vista Query e la modale possono convivere.","Comunica il troncamento per le voci escluse dai limiti. L’editor conserva il contesto di scrittura e i riferimenti spaziali del dato."],"sources":["public/js/geo-risultati.js","public/js/geo-vista.js","public/js/query-map.js","public/js/geomulti.js","public/js/geomap.js"],"tests":["test/unit-geo-risultati.js","test/e2e-geometrie-viste.js","test/e2e-editor-geometrico.js"],"section":"workspace"},"schema-diagrams":{"kind":"concept","title":"UML, progettazione SQL e grafo 3D","summary":"Il modello UML conserva nodi e differenze fra vincoli dichiarati, relazioni inferite e relazioni logiche del disegno. JointJS e il grafo 3D offrono viste specializzate.","rules":["Per cambiare lo schema dal diagramma, richiedi anteprima e token, poi verifica sessione, bersaglio e permessi al momento dell’applicazione.","Salva il documento con la revisione di partenza nel proprio ambito. Drena il catalogo secondo i cursori separati e rispetta i limiti di visualizzazione."],"sources":["public/js/uml-modello.js","public/js/uml-paper.js","public/js/uml-store.js","db/umlProgetto.js","public/js/graph3d.js"],"tests":["test/e2e-uml-modalita.js","test/e2e-uml-progetto-db.js","test/unit-grafo-budget.js"],"section":"workspace"},"live-monitoring":{"kind":"concept","title":"Aggiornamento live, salute e sessioni DB","summary":"I change stream propagano i cambiamenti dove supportati e la UI può proporre il polling. I pannelli distinguono la salute del collegamento dalle sessioni e dai lock dentro il DBMS.","rules":["Il polling automatico rispetta tab attivo, documento visibile ed editing in corso. schema:changed invalida i metadati del completamento.","Nel monitor, prima di annullare o terminare un backend ricontrolla l’identità osservata. Un identificativo di processo può essere riutilizzato."],"sources":["public/js/live.js","public/js/health.js","public/js/sessions.js","db/sessioni.js","server/eventi-monitoraggio.js"],"tests":["test/unit-sessioni-identita.js","test/e2e-sessions.js"],"section":"workspace"},"transfer":{"kind":"section","title":"Export e backup","summary":"Formati, coerenza della sorgente, trasferimento dei byte e recupero dopo applicazione parziale.","rules":[],"sources":[],"tests":["test/lab/INTEGRITA.md"],"area":"data","anchor":"export-backup-e-recupero"},"export-formats":{"kind":"concept","title":"Formati di esportazione","summary":"L’export dalla scheda Query produce JSON delle righe caricate. L’export del database dalla sidebar può includere dati, schema e oggetti selezionati.","rules":["Usa .codedb.json sui tre motori, .sql sui motori SQL o .mongosh.js su MongoDB. Il formato completo conserva il BSON MongoDB grezzo in base64.","Per mongosh il piano firma la politica su collection e viste e la scrittura per _id. La ricreazione conserva gli oggetti inclusi soltanto per dipendenza. Il generatore verifica la rappresentazione BSON prima del download.","La copia diretta MongoDB richiede una destinazione esplicita. L’evento database:export:execute consuma il piano confermato, lega le due sessioni e restituisce i conteggi delle operazioni confermate anche in caso di errore parziale.","Negli script .sql il piano firma le opzioni per creare, conservare o ricreare le tabelle e per inserire, aggiornare o ignorare i duplicati. Solo MySQL offre anche REPLACE. DROP TABLE riguarda le tabelle di cui si è scelta la struttura.","Una vista si esporta con la sua definizione, anche da sola. Il catalogo distingue le viste dalle tabelle o collection di cui dipendono. Su MongoDB conserva le definizioni delle viste ed esclude la collection interna system.views.","Per un dato tipizzato verifica il formato scelto e la rilettura dei byte o del valore sul DBMS di destinazione."],"sources":["public/js/export-json.js","public/js/exportimport.js","db/exportCatalogo.js","db/exportPlan.js","db/databaseExport.js","db/exportSqlTabelle.js","db/exportMongoScript.js","db/exportMongoStruttura.js","db/eseguiExportMongo.js","server/eventi-import.js","db/pg-partizioni.js","db/exportFile.js","docs/matrice-fedelta-export-import.md"],"tests":["test/unit-query-export-json.js","test/e2e-export-opzioni-sql-ui.js","test/e2e-export-mongosh.js","test/e2e-export-mongo-diretto.js","test/e2e-esegui-export-mongo.js","test/e2e-export-regressioni.js","test/e2e-export-formati.js"],"section":"transfer"},"transfer-plan":{"kind":"concept","title":"Piano e impronta","summary":"Il piano identifica connessione, destinazione, oggetti e opzioni della singola operazione.","rules":["I wizard di export e import verificano l’impronta dell’anteprima confermata. Cambi di destinazione o selezione richiedono un’altra anteprima.","L’anteprima di import espone i nomi delle viste. Il lettore SQL riconosce sia i dump di sole viste sia le tabelle segnaposto sostituite dalla definizione finale.","La CLI restore stampa l’impronta e procede nella stessa invocazione. L’evento backup:restore usa l’impronta nel registro dell’operazione.","Verifica separatamente checksum dei file e ammissibilità della DDL prima di applicarla."],"sources":["db/pianoComune.js","db/importSql.js","db/importPlan.js","server/eventi-import.js","server/eventi-backup.js","backup/cli.js","backup/lib/restore-catena.js"],"tests":["test/unit-piano-export-evento.js","test/unit-piano-import.js","test/unit-backup-validator.js"],"section":"transfer"},"artifact-transport":{"kind":"concept","title":"Trasporto degli artefatti","summary":"Gli eventi socket governano l’operazione. Il servizio HTTP trasferisce blocchi e file finalizzati, mentre il wizard import possiede anche un proprio protocollo socket.","rules":["Ogni ticket HTTP è breve e vincolato a risorsa, attore e tenant. Verifica offset e SHA-256 del blocco, gestisci una ripetizione identica e conserva ETag e Range sul download.","database:import:upload:* verifica ordine e dimensione dei blocchi, proprietario e quote. Considera la dimensione massima accettata dall’import anche per file prodotti localmente."],"sources":["server/http-artefatti.js","db/artefatti.js","db/importUploads.js","server/eventi-import.js","docs/guida-export-import.md"],"tests":["test/unit-http-artefatti.js","test/unit-import-uploads.js","test/e2e-import-upload-ui.js"],"section":"transfer"},"source-consistency":{"kind":"concept","title":"Coerenza della sorgente","summary":"La coerenza temporale della copia dipende dai motori e dalla topologia dell’origine.","rules":["I percorsi SQL transazionali usano repeatable-read. Le tabelle MySQL non transazionali richiedono scritture sospese per una copia coerente.","Sulle topologie MongoDB compatibili la snapshot copre i documenti. Mantieni stabile il catalogo durante la copia. Su standalone la coerenza globale richiede scritture sospese."],"sources":["db/mongoTopologia.js","db/databaseExport.js","docs/guida-export-import.md"],"tests":["test/e2e-dbexport.js","test/e2e-export-formati.js"],"section":"transfer"},"backup-chain":{"kind":"concept","title":"Catena di backup","summary":"Il full stabilisce la base. Un differenziale si riferisce al full, un incrementale al predecessore previsto.","rules":["Il manifest v6 dichiara la copertura della copia e le entità rimosse. Le cancellazioni di righe usano tombstone di identità. Senza identità stabile si salva una snapshot completa.","Risolvi baseId e valida tutti i layer prima del primo effetto. Un file storico privo di checksum rimane UNVERIFIABLE.","La CLI legge le connessioni salvate e condivide vault e motore. verify controlla il disco. Un round trip su motore reale verifica anche tipi e schema. S3, GCS e Azure usano adattatori opzionali."],"sources":["backup/lib/engine.js","backup/lib/identity.js","backup/lib/restore-catena.js","backup/lib/storage.js","backup/cli.js"],"tests":["test/unit-tombstone-backup.js","test/lab/backup-incrementali.cjs","test/e2e-backup.js"],"section":"transfer"},"restore-promotion":{"kind":"concept","title":"Staging e recupero","summary":"Il percorso protetto valida il piano e verifica lo staging prima di promuovere i dati alla destinazione.","rules":["Se la destinazione esiste, richiedi una copia di recupero verificata. Dopo la promozione confronta dati e schema prima della finalizzazione.","PostgreSQL può scambiare gli schemi atomicamente. Per MySQL e MongoDB considera la finestra di promozione e le scritture concorrenti.","Conserva gli esiti completato, ripristinato_dopo_errore e intervento_richiesto. Il diario conserva per tenant i riferimenti privati e l’avanzamento della pulizia. Dopo un riavvio verifica identità e stato prima di rimuovere ciascuna risorsa."],"sources":["db/importPlan.js","db/diarioOperazioni.js","db/importCleanup.js","db/promozioneMerge.js","backup/lib/restore.js","db/pg-restore-transaction.js"],"tests":["test/unit-import-conferma.js","test/lab/backup-promozione-postgres.cjs","test/e2e-integrita-import.js"],"section":"transfer"},"mcp":{"kind":"section","title":"Gateway MCP","summary":"Sessioni di protocollo, strumenti, limiti di sola lettura e conferma delle mutazioni.","rules":[],"sources":[],"tests":[],"area":"ops","anchor":"gateway-mcp"},"mcp-session":{"kind":"concept","title":"Sessione e identità MCP","summary":"Il gateway /mcp usa Streamable HTTP. Una sessione del protocollo può aprire più connessioni DB nominate con connect_database.","rules":["Con RBAC attivo autentica l’API key, confronta identità e impronta della credenziale anche sulle richieste successive e aggiorna i permessi correnti. In locale con RBAC spento il principal è root locale.","Il limite configurabile delle sessioni MCP è distinto dal budget di 100 sessioni DB per istanza condiviso con la UI."],"sources":["mcp/McpGateway.js","server/mcp.js","mcp/Settings.js","server/budget.js","docs/MCP.md"],"tests":["test/unit-mcp-auth.js","test/e2e-rbac-mcp.js","test/e2e-mcp-states.js"],"section":"mcp"},"mcp-tools":{"kind":"concept","title":"Strumenti, risorse e prompt","summary":"Il gateway registra separatamente strumenti di lettura, scrittura, artefatti, risorse e prompt.","rules":["Usa gli strumenti di lettura per get_schema, execute_query, get_shortest_path e analyze_pii. Mantieni validazione, forma MCP degli errori, attività e impostazioni del wrapper comune.","Colloca execute_write ed execute_ddl nel modulo di scrittura, backup_database e restore_backup in quello degli artefatti. Per categorie nuove verifica anche audit e pannello di amministrazione."],"sources":["mcp/McpGateway.js","mcp/strumenti-lettura.js","mcp/strumenti-scrittura.js","mcp/strumenti-artefatti.js","mcp/risorse-e-prompt.js","public/js/mcp-panel.js"],"tests":["test/e2e-mcp.js","test/e2e-mcp-control.js","test/unit-mcp-payload.js"],"section":"mcp"},"mcp-confirmation":{"kind":"concept","title":"Conferma delle mutazioni","summary":"execute_write prepara l’anteprima, memorizza la proposta nella sessione e prenota un confirm_token monouso.","rules":["Mostra l’anteprima all’utente. Dopo approvazione esplicita presenta il token con connection_id. Il server verifica tipo e connessione e applica la proposta originale con i permessi correnti.","Esercita consenso scaduto, seconda conferma concorrente e revoca tra le due chiamate. Consumo e scadenza liberano la quota prenotata."],"sources":["mcp/conferma.js","mcp/ConfirmQuota.js","mcp/strumenti-scrittura.js"],"tests":["test/unit-mcp-conferme-quota.js","test/e2e-rbac-mcp.js"],"section":"mcp"},"mcp-write-policy":{"kind":"concept","title":"Politica di scrittura MCP","summary":"Il wrapper combina le impostazioni globali del gateway con il flag della connessione e i permessi dell’attore.","rules":["La connessione salvata deve consentire esplicitamente le scritture con readOnly=false. Rileggi questo flag prima dell’esecuzione.","Verifica anche i controlli globali separati per DDL, backup e import. Una modifica delle impostazioni può intervenire dopo l’anteprima."],"sources":["mcp/McpGateway.js","mcp/Settings.js","mcp/strumenti-scrittura.js","mcp/strumenti-artefatti.js"],"tests":["test/unit-mcp-settings.js","test/unit-mcp-execute-ddl.js","test/e2e-mcp-control.js"],"section":"mcp"},"delivery":{"kind":"section","title":"Distribuzione","summary":"Esecuzione e pacchetti per web, Docker, Electron e Android con i rispettivi confini di rete e filesystem.","rules":[],"sources":[".env.example"],"tests":[],"area":"ops","anchor":"distribuzione"},"web-network":{"kind":"concept","title":"Web e pubblicazione di rete","summary":"Express serve public/. Il trasporto Socket.IO controlla Origin e Host prima di aprire una sessione DB.","rules":["Avvia con npm start oppure npm run dev. Per un handshake rifiutato usa GET /handshake-check, poi verifica separatamente login applicativo, tunnel e credenziali DB.","Per la condivisione ordinaria fuori dal loopback usa un reverse proxy che termini realmente HTTPS, CODEDB_TRUST_PROXY_TLS=1 e RBAC attivo. Cifratura e autenticazione hanno controlli separati."],"sources":["server/trasporto.js","server/createServer.js","package.json"],"tests":["test/unit-avvio-rete.js","test/unit-server-modulare.js"],"section":"delivery"},"docker-runtime":{"kind":"concept","title":"Runtime Docker Compose","summary":"Lo stack principale ospita CodeDB, MongoDB e MySQL. L’immagine di produzione copia i bundle statici già costruiti e i moduli runtime selezionati.","rules":["Usa docker compose up -d --build dopo aver configurato le credenziali di sviluppo. Il bind pubblicato della GUI e quello dei DBMS sono separati.","Mantieni dati e backup su volumi persistenti. Verifica che un nuovo modulo runtime o asset sia incluso nell’immagine finale."],"sources":["docker-compose.yml","Dockerfile","server/trasporto.js"],"tests":["test/unit-avvio-rete.js"],"section":"delivery"},"electron-runtime":{"kind":"concept","title":"Applicazione Electron","summary":"Il desktop ospita il server Node in-process, con lock di singola istanza e verifica del server locale.","rules":["npm run electron:start avvia da sorgenti. Se la porta predefinita è occupata il processo principale può sceglierne una disponibile. Nella distribuzione i dati risiedono in userData.","Conserva sandbox, contextIsolation e integrazione Node disattivata nella finestra. Verifica la chiusura con lavoro pendente e la build pacchettizzata."],"sources":["electron-main.js","electron-server-auth.js","electron-chiusura.js","electron-aggiornamenti.js"],"tests":["test/unit-electron-server-auth-process.js","test/e2e-mongosh-electron.cjs"],"section":"delivery"},"android-runtime":{"kind":"concept","title":"Applicazione Android","summary":"Una WebView visualizza il workbench del server Node Mobile in esecuzione sul telefono.","rules":["Usa npm run prepare:android e npm run build:android. La preparazione include anche i nuovi moduli del runtime e gli asset statici ammessi dal filtro, rispettando gli ignore di Git.","localhost è il telefono. Mantieni la protezione con cookie privato anche sul loopback. Distingui il controllo del contenuto dell’APK dal test sul dispositivo."],"sources":["android/prepare.cjs","android/mobile.cjs","android/README.md"],"tests":["android/test.cjs","test/e2e-mobile-android.js"],"section":"delivery"},"release-packaging":{"kind":"concept","title":"Packaging e aggiornamenti","summary":"Gli script build:win, build:mac e build:linux producono i pacchetti di piattaforma. Gli script dist:* creano le distribuzioni portatili.","rules":["Il workflow verifica versione, test, build della UI e artefatti in bozza. Firma e aggiornamenti seguono le procedure del target.","Controlla l’inclusione dei moduli nativi ed escludi vault, configurazioni personali, log e backup. Esegui il pacchetto per rilevare file disponibili soltanto nel checkout."],"sources":["package.json",".github/workflows/release.yml","tools/verifica-mongosh-nativi.cjs","docs/CODE_SIGNING.md","docs/WINDOWS_DISTRIBUTION.md"],"tests":["test/unit-release-bozza.js","test/unit-release-gpg.cjs"],"section":"delivery"},"testing":{"kind":"section","title":"Verifica","summary":"Dalla modifica osservabile alla prova che rileva la regressione su una fixture isolata.","rules":[],"sources":[".github/workflows/release.yml","android/test.cjs","docs/adr/"],"tests":["test/e2e-import-volume.js"],"area":"ops","anchor":"sviluppare-e-verificare-una-modifica"},"change-contract":{"kind":"concept","title":"Contratto della modifica","summary":"Definisci un esito osservabile indicando motore, bersaglio, tipo di dato, azione e superficie. Segui il percorso esistente dal chiamante al DBMS.","rules":["Prova casi pertinenti come chiave composta, tab cambiato durante la lettura, formato storico o ack perso dopo una scrittura. Verifica anche il caso fuori scope per una modifica ai permessi.","Allinea contratto, chiamanti, test e guida. Per il lessico consulta il glossario e per le ragioni architetturali gli ADR."],"sources":["AGENTS.md","CONTEXT.md","CONTRIBUTING.md","docs/adr/0001-tre-famiglie-di-evento.md"],"tests":["test/unit-tabella-autorizzazioni.js","test/unit-registrazione-eventi.js"],"section":"testing"},"test-selection":{"kind":"concept","title":"Scelta delle prove","summary":"Collega ogni asserzione al livello che può dimostrarla. Un test di protocollo verifica un ack, mentre la lettura dal driver dimostra l’effetto sul database.","rules":["npm test aggrega i test unitari. Per Socket.IO e permessi usa unit-registrazione-eventi, unit-tabella-autorizzazioni e unit-server-modulare.","Per controlli Arc esegui npm run typecheck:ui, npm run build:ui e npm run test:e2e:arc. Verifica anche il documento originario se la richiesta termina dopo un cambio scheda.","Per il trasferimento ricontrolla dati, tipi, schema e vincoli su un DBMS di prova. e2e-export-formati richiede EXPORT_MYSQL_PORT, EXPORT_PG_PORT e EXPORT_MONGO_PORT esplicite."],"sources":["package.json","test/server-fixture.js","docs/sql-nativo.md","docs/matrice-fedelta-export-import.md"],"tests":["test/unit.js","test/e2e-arc-griglia.js","test/e2e-pagine-obsolete.js","test/e2e-export-formati.js"],"section":"testing"},"test-isolation":{"kind":"concept","title":"Isolamento delle fixture","summary":"startTestServer apre una porta dedicata e isola connessioni salvate, vault, audit e backup dell’istanza E2E.","rules":["Una porta già occupata viene rifiutata. Il motore DB indicato dalla suite resta reale, quindi usa database e schemi posseduti dalla fixture.","Il cleanup distruttivo di createE2eTargetRegistry richiede ownership del bersaglio, destructive: true e CODEDB_E2E_DESTRUCTIVE=1."],"sources":["test/e2e-harness.js","test/all-e2e.js","test/lab/README.md"],"tests":["test/e2e-dbexport.js","test/e2e-rbac.js"],"section":"testing"},"test-sensitivity":{"kind":"concept","title":"Sensibilità delle regressioni","summary":"Una nuova prova va eseguita sul codice corretto e su un difetto deliberato o sulla versione originaria difettosa.","rules":["node test/unit-import-conferma.js verifica la finalizzazione dopo la verifica della destinazione. Con --mutant la finalizzazione viene saltata in memoria e deve fallire l’asserzione pertinente.","Nel rapporto annota comando, ambiente, esito osservato e perimetro ancora aperto."],"sources":["AGENTS.md","db/importPlan.js","test/lab/README.md"],"tests":["test/unit-import-conferma.js","test/lab/unit-sensitivity.cjs"],"section":"testing"},"reliability-lab":{"kind":"concept","title":"Laboratorio di affidabilità","summary":"Il laboratorio Docker avvia DBMS usa e getta e usa riletture indipendenti con driver nativi o osservazioni nel browser.","rules":["Con Docker Linux, Compose, Node e Git usa npm run lab:prepara. lab:nuovi esegue le prove dedicate, lab:test le suite compatibili e lab:rapporti raccoglie gli esiti.","Le campagne condividono porte e fixture nello stesso runner. Riporta separatamente timeout, fallimenti, casi saltati e prerequisiti del profilo."],"sources":["test/lab/README.md","test/lab/INTEGRITA.md","tools/laboratorio.cjs",".github/workflows/laboratorio.yml"],"tests":["test/lab/integrita.cjs","test/lab/runner.cjs","test/lab/native.cjs"],"section":"testing"}},"edges":[{"from":"codedb","rel":"contains","to":"core"},{"from":"codedb","rel":"contains","to":"data"},{"from":"codedb","rel":"contains","to":"client"},{"from":"codedb","rel":"contains","to":"ops"},{"from":"core","rel":"contains","to":"repo"},{"from":"repo","rel":"contains","to":"domain-targets"},{"from":"repo","rel":"contains","to":"application-surfaces"},{"from":"repo","rel":"contains","to":"shared-modules"},{"from":"core","rel":"contains","to":"runtime"},{"from":"runtime","rel":"contains","to":"local-development"},{"from":"runtime","rel":"contains","to":"instance-config"},{"from":"runtime","rel":"contains","to":"server-lifecycle"},{"from":"runtime","rel":"contains","to":"session-ownership"},{"from":"core","rel":"contains","to":"transport"},{"from":"transport","rel":"contains","to":"event-families"},{"from":"transport","rel":"contains","to":"socket-request"},{"from":"transport","rel":"contains","to":"grid-page"},{"from":"transport","rel":"contains","to":"cell-write"},{"from":"core","rel":"contains","to":"errors"},{"from":"errors","rel":"contains","to":"driver-diagnosis"},{"from":"errors","rel":"contains","to":"query-error-range"},{"from":"errors","rel":"contains","to":"uncertain-outcome"},{"from":"errors","rel":"contains","to":"partial-failure"},{"from":"data","rel":"contains","to":"strategies"},{"from":"strategies","rel":"contains","to":"guarded-strategy"},{"from":"strategies","rel":"contains","to":
