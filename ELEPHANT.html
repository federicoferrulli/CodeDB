  <script>
    'use strict';
    function createMap(svg, model, selectNode, onZoom) {
      const ns = 'http://www.w3.org/2000/svg';
      const palette = colors;
      const labels = {
        repo: 'Repository', runtime: 'Avvio', transport: 'Trasporto', errors: 'Errori',
        strategies: 'Strategie', queries: 'Query e script', transfer: 'Trasferimenti',
        frontend: 'Frontend', workspace: 'Workspace', security: 'Sicurezza',
        mcp: 'Gateway MCP', delivery: 'Distribuzione', testing: 'Verifica'
      };
      const phrases = model.relations;
      const adjacency = new Map();
      function connections(id) {
        if (!adjacency.has(id)) adjacency.set(id, []);
        return adjacency.get(id);
      }
      for (const edge of model.edges) {
        connections(edge.from).push(edge);
        if (edge.from !== edge.to) connections(edge.to).push(edge);
      }
      function sectionArea(id) {
        const node = model.nodes[id];
        if (palette[id]) return id;
        if (node?.area) return node.area;
        return model.nodes[node?.section]?.area;
      }
      function colorOf(id) {
        return palette[sectionArea(id)] || '#c1afff';
      }
      function el(tag, attrs = {}) {
        const item = document.createElementNS(ns, tag);
        for (const [name, value] of Object.entries(attrs)) item.setAttribute(name, String(value));
        return item;
      }
      function child(parent, tag, attrs, value) {
        const item = el(tag, attrs);
        if (value !== undefined) item.textContent = value;
        parent.append(item);
        return item;
      }

      const defs = el('defs');
      const world = el('g');
      const wires = el('g', { 'aria-hidden': 'true' });
      const vertices = el('g');
      world.append(wires, vertices);
      svg.replaceChildren(defs, world);
      svg.style.touchAction = 'none';
      svg.style.userSelect = 'none';
      svg.style.cursor = 'grab';
      svg.setAttribute('role', 'group');
      svg.setAttribute('aria-label', 'Mappa interattiva delle relazioni');
      const prefix = (svg.id || 'elephant-map') + '-freccia-';
      for (const [name, color] of Object.entries({ ...palette, root: '#c1afff' })) {
        const marker = child(defs, 'marker', {
          id: prefix + name, viewBox: '0 0 8 8', refX: 7, refY: 4,
          markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse', markerUnits: 'userSpaceOnUse'
        });
        child(marker, 'path', { d: 'M1.2 1.3 6.7 4 1.2 6.7', fill: 'none', stroke: color, 'stroke-width': 1.35, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
      }
      child(defs, 'style', {}, [
        '.em-node{cursor:pointer;outline:none}',
        '.em-node .em-hit{fill:transparent;pointer-events:all}',
        '.em-node .em-focus{opacity:0;pointer-events:none}',
        '.em-node:hover .em-focus,.em-node:focus-visible .em-focus{opacity:1}',
        '.em-node:hover text,.em-node:focus-visible text{fill:#fff}',
        '.em-node:focus-visible .em-focus{stroke:#fff;stroke-width:2}',
        '.em-node text{pointer-events:none;paint-order:stroke;stroke:#15171d;stroke-width:3;stroke-linejoin:round}'
      ].join('\n'));

      const glyphs = {
        root: ['M-9 -6c0-4.5 18-4.5 18 0s-18 4.5-18 0Z','M-9 -6V6c0 4.5 18 4.5 18 0V-6','M-9 0c0 4.5 18 4.5 18 0'],
        core: ['M0 -6.5 7  -3 0 .5 -7 -3Z','M-7 .2 0 3.7 7 .2','M-7 3.5 0 7 7 3.5'],
        data: ['M-6 -4c0-3.2 12-3.2 12 0s-12 3.2-12 0Z','M-6 -4v8c0 3.2 12 3.2 12 0v-8','M-6 0c0 3.2 12 3.2 12 0'],
        client: ['M-6.5 -5.5H6.5V5.5H-6.5Z','M-2.5 -5.5V5.5'],
        ops: ['M-7 0h3l2-5 3.4 10L4 0h3']
      };
      const meter = document.createElement('canvas').getContext('2d');
      const font = 'Inter, system-ui, sans-serif';
      function textLines(value, max, size, weight, maxLines = 2) {
        const words = value.trim().split(/\s+/u);
        meter.font = weight + ' ' + size + 'px ' + font;
        const fits = str => meter.measureText(str).width <= max;
        const lines = [];
        let current = '';
        let omitted = false;
        for (const word of words) {
          const next = current ? current + ' ' + word : word;
          if (fits(next)) { current = next; continue; }
          if (current) {
            lines.push(current);
            current = '';
            if (lines.length === maxLines) { omitted = true; break; }
          }
          if (fits(word)) { current = word; continue; }
          let part = word;
          while (part.length > 1 && !fits(part + '…')) part = part.slice(0, -1);
          current = part + '…';
        }
        if (current && lines.length < maxLines) lines.push(current);
        if (omitted) {
          let last = lines[lines.length - 1];
          while (last.length && !fits(last + '…')) last = last.slice(0, -1);
          lines[lines.length - 1] = last + '…';
        }
        return lines;
      }
      function vertex(id, point, options = {}) {
        const item = model.nodes[id];
        const { x, y, r } = point;
        const accent = colorOf(id);
        const center = options.center === true;
        const group = item.kind === 'area';
        const large = center || group;
        const direction = options.label || 'below';
        const max = options.max || 116;
        const size = center ? (id === model.root ? 17 : 14) : group ? 13 : 12;
        const weight = large ? 600 : 500;
        const caption = options.short && labels[id] || item.title;
        const lines = textLines(caption, max, size, weight);
        const step = size + 3;
        const right = direction === 'right';
        const side = right || direction === 'left';
        const tx = side ? (r + 8) * (right ? 1 : -1) : 0;
        const ty = side ? 4 - (lines.length - 1) * step / 2 : direction === 'above' ? -r - 9 - (lines.length - 1)*step : r + size + 6;
        const anchor = side ? (right ? 'start' : 'end') : 'middle';
        const boxWidth = Math.max(2*r + 10, ...lines.map(line => meter.measureText(line).width + 8));
        const left = Math.min(-r - 6, tx + (right ? -4 : direction === 'left' ? -boxWidth : -boxWidth/2));
        const extreme = Math.max(r + 6, tx + (right ? boxWidth : direction === 'left' ? 4 : boxWidth/2));
        const top = Math.min(-r - 5, ty - size);
        const bottom = Math.max(r + 5, ty + (lines.length - 1) * step + 4);
        const node = child(vertices,'g',{
          class:'em-node', 'data-id':id, transform:'translate('+x+' '+y+')',
          role:'button', tabindex:0, 'aria-label':item.title, 'aria-current':id === selected ? 'true' : 'false'
        });
        child(node,'title',{},item.title);
        child(node,'rect',{class:'em-hit',x:left,y:top,width:extreme-left,height:bottom-top,rx:4});
        child(node,'circle',{class:'em-focus',r:r+4,stroke:accent,fill:'none','stroke-width':1.4});
        if (large) {
          child(node,'circle',{r,fill:center?'#282538':'#1c222a',stroke:accent,'stroke-width':center?1.8:1.4});
          const symbol = id === model.root ? glyphs.root : group ? glyphs[id] : null;
          if (symbol) for (const d of symbol) child(node,'path',{d, fill:'none',stroke:accent,'stroke-width':1.5,'stroke-linecap':'round','stroke-linejoin':'round'});
          else {
            child(node,'path',{d:'M-6 0 0-6 6 0 0 6Z',fill:'none',stroke:accent,'stroke-width':1.5});
            child(node,'circle',{r:1.7,fill:accent});
          }
        } else {
          child(node,'circle',{r,fill:'#1a1c23',stroke:accent,'stroke-width':1.7});
          if (item.kind === 'section') child(node,'circle',{r:1.4,fill:accent});
        }
        const label = child(node,'text',{x:tx,y:ty,'text-anchor':anchor,'font-size':size,'font-family':font,'font-weight':weight,fill:large?'#edeef5':'#ced0db'});
        lines.forEach((line,i)=>child(label,'tspan',{x:tx,dy:i?step:0},line));
      }

      function wire(a,b,colorId,axis='x',twoWays=false) {
        const xAxis = axis === 'x';
        const sign = Math.sign(xAxis ? b.x-a.x : b.y-a.y) || 1;
        const ax = a.x + (xAxis ? sign*(a.r+2) : 0);
        const ay = a.y + (xAxis ? 0 : sign*(a.r+2));
        const bx = b.x - (xAxis ? sign*(b.r+3) : 0);
        const by = b.y - (xAxis ? 0 : sign*(b.r+3));
        const mid = xAxis ? (ax+bx)/2 : (ay+by)/2;
        const path = xAxis ? 'M'+ax+','+ay+' C'+mid+','+ay+' '+mid+','+by+' '+bx+','+by
          : 'M'+ax+','+ay+' C'+ax+','+mid+' '+bx+','+mid+' '+bx+','+by;
        const marker = 'url(#'+prefix+(sectionArea(colorId)||'root')+')';
        const attrs = {d:path, fill:'none',stroke:colorOf(colorId),'stroke-opacity':.59,'stroke-width':1.3,'marker-end':marker};
        if (twoWays) attrs['marker-start'] = marker;
        return child(wires,'path',attrs);
      }

      let selected = model.root, width = 0, height = 0;
      let scale = 1, offsetX = 0, offsetY = 0, reported = 0;
      function updateCamera() {
        world.setAttribute('transform','translate('+offsetX+' '+offsetY+') scale('+scale+')');
        const pct = Math.round(scale*100);
        if (reported !== pct) { reported = pct; onZoom(pct); }
      }
      function fit() {
        scale = 1; offsetX = 0; offsetY = 0; updateCamera();
      }
      function zoom(factor, x = width/2, y = height/2) {
        if (!Number.isFinite(factor) || factor <= 0) return;
        const next = Math.max(.45,Math.min(3.5,scale*factor));
        offsetX = x - (x-offsetX)*next/scale; offsetY = y - (y-offsetY)*next/scale;
        scale = next; updateCamera();
      }
      function overview() {
        const small = width < 560;
        const origin = {x:width/2, y:height*.47, r:small?20:25};
        const items = [['core',-1,-1],['data',1,-1],['client',-1,1],['ops',1,1]];
        for (const [id,side,row] of items) {
          if (!model.nodes[id]) continue;
          const hub = {x:width*(.5+side*(small?.29:.19)),y:height*(row<0?.26:.70),r:small?13:14};
          wire(origin,hub,id);
          if (!small) {
            const children = connections(id).filter(edge=>edge.from===id && edge.rel==='contains').map(edge=>edge.to);
            const dotX = side<0 ? Math.min(125,width*.17) : width-Math.min(125,width*.17);
            const spacing = Math.min(31,height*.065);
            children.forEach((childId,i)=>{
              const dot = {x:dotX,y:hub.y+(i-(children.length-1)/2)*spacing,r:4};
              wire(hub,dot,id);
              vertex(childId,dot,{short:true,label:side<0?'left':'right',max:Math.min(dotX,width-dotX)-16});
            });
          }
          vertex(id,hub,{max:Math.min(140,width*.34)});
        }
        vertex(model.root,origin,{center:true,max:142});
      }
      function neighborhood() {
        const small = width < 560;
        const root = {x:width/2,y:height*(small?.46:.47),r:18};
        const neighbors = new Map();
        for (const edge of connections(selected)) {
          const incoming = edge.to === selected;
          const id = incoming ? edge.from : edge.to;
          if (id === selected || !model.nodes[id]) continue;
          if (!neighbors.has(id)) neighbors.set(id,{id,ins:[],outs:[]});
          neighbors.get(id)[incoming?'ins':'outs'].push(edge);
        }
        const near = [...neighbors.values()].sort((a,b)=>{
          const isFamily = peer => peer.ins.concat(peer.outs).some(edge=>edge.rel==='contains');
          return Number(isFamily(b))-Number(isFamily(a));
        });
        const sides = [[],[]];
        for (const peer of near) {
          const left = peer.ins.length && (!peer.outs.length || sides[0].length <= sides[1].length);
          sides[left?0:1].push(peer);
        }
        sides.forEach((list,i)=>{
          const side = i===0?-1:1;
          const limit = small ? (width<335?2:3) : Math.min(7,Math.max(3,Math.floor((height-38)/53)));
          const shown = list.slice(0,limit);
          shown.forEach((peer,index)=>{
            const interval = height/(shown.length+1);
            const delta = Math.min(interval,67);
            const x = small ? (index+.5)*width/shown.length : width*(side<0?.31:.69);
            const y = small ? height*(side<0?.28:.71) : root.y+(index-(shown.length-1)/2)*delta;
            const group = model.nodes[peer.id].kind==='area';
            const end = {x,y,r:group?11:4.5};
            const goesOut = Boolean(peer.outs.length);
            const path = wire(goesOut?root:end,goesOut?end:root,peer.id,small?'y':'x',Boolean(peer.ins.length && peer.outs.length));
            const describe = edge => model.nodes[edge.from].title+' '+(phrases[edge.rel]||edge.rel)+' '+model.nodes[edge.to].title;
            child(path,'title',{},peer.ins.concat(peer.outs).map(describe).join('\n'));
            const max = small ? Math.min(150,width/shown.length-10) : Math.min(217,width*.31-end.r-17);
            vertex(peer.id,end,{max,label:small?(side<0?'above':'below'):(side<0?'left':'right')});
          });
        });
        vertex(selected,root,{center:true,max:small?Math.max(110,width*.43):Math.min(170,width*.30)});
      }
      function draw() {
        if (!width || !height) return;
        wires.replaceChildren();
        vertices.replaceChildren();
        if (selected===model.root) overview(); else neighborhood();
      }
      function resize() {
        const rect = svg.getBoundingClientRect();
        const w = Math.round(rect.width), h = Math.round(rect.height);
        if (!w || !h || (width===w && height===h)) return;
        width=w; height=h;
        svg.setAttribute('viewBox','0 0 '+w+' '+h);
        draw(); fit();
      }
      function show(id) {
        if (!Object.hasOwn(model.nodes,id)) return;
        const hadFocus = vertices.contains(document.activeElement);
        selected=id; resize(); draw(); fit();
        if (hadFocus) {
          [...vertices.children].find(node=>node.dataset.id===id)?.focus({preventScroll:true});
        }
      }
      function activate(target) {
        const node = target.closest?.('g[data-id]');
        if (node && vertices.contains(node)) selectNode(node.dataset.id);
      }
      svg.addEventListener('keydown',event=>{
        if (event.key==='Enter' || event.key===' ') { event.preventDefault(); activate(event.target); }
      });
      let drag = null, suppressClick = false;
      svg.addEventListener('pointerdown',event=>{
        if (drag || !event.isPrimary || event.button!==0) return;
        drag={id:event.pointerId,x:event.clientX,y:event.clientY,ox:offsetX,oy:offsetY,moved:false};
        suppressClick=false;
      });
      svg.addEventListener('pointermove',event=>{
        if (!drag || event.pointerId!==drag.id) return;
        const dx=event.clientX-drag.x, dy=event.clientY-drag.y;
        if (!drag.moved && Math.hypot(dx,dy)<5) return;
        if (!drag.moved) {
          svg.setPointerCapture(event.pointerId); drag.moved=true; svg.style.cursor='grabbing';
        }
        offsetX=drag.ox+dx; offsetY=drag.oy+dy; updateCamera();
      });
      function endDrag(event) {
        if (!drag || event.pointerId!==drag.id) return;
        suppressClick=drag.moved;
        if (svg.hasPointerCapture(drag.id)) svg.releasePointerCapture(drag.id);
        drag=null; svg.style.cursor='grab';
      }
      svg.addEventListener('pointerup',endDrag);
      svg.addEventListener('pointercancel',endDrag);
      svg.addEventListener('pointerleave',event=>{ if (drag && !drag.moved) endDrag(event); });
      svg.addEventListener('click',event=>{ if(!suppressClick)activate(event.target); suppressClick=false; });
      svg.addEventListener('wheel',event=>{
        if (!event.deltaY) return;
        event.preventDefault();
        const point=svg.getBoundingClientRect();
        zoom(event.deltaY<0?1.12:1/1.12,event.clientX-point.left,event.clientY-point.top);
      },{passive:false});
      resize();
      return {show,zoom,fit,resize};
    }

    const model = JSON.parse(document.getElementById('graph-data').textContent);
    const byId = id => document.getElementById(id);
    const names = { root: 'Applicazione', area: 'Area', section: 'Capitolo', concept: 'Concetto' };
    const colors = { core: '#b6a4fa', data: '#64d4bd', client: '#ecb779', ops: '#83bdfa' };
    const entries = Object.entries(model.nodes);
    const search = byId('search');
    const results = byId('results');
    const detail = byId('detail');
    const list = byId('node-list');
    const steps = byId('steps');
    const route = byId('route');
    let selected = null;
    let matchIndex = -1;

    function element(tag, className, value) {
      const item = document.createElement(tag);
      if (className) item.className = className;
      if (value !== undefined) item.textContent = value;
      return item;
    }
    function icon(name) {
      const ns = 'http://www.w3.org/2000/svg';
      const img = document.createElementNS(ns, 'svg');
      img.setAttribute('class', 'icon');
      img.setAttribute('aria-hidden', 'true');
      const use = document.createElementNS(ns, 'use');
      use.setAttribute('href', '#i-' + name);
      img.append(use);
      return img;
    }
    function nodeButton(id, className) {
      const button = element('button', className, model.nodes[id].title);
      button.type = 'button';
      button.dataset.id = id;
      return button;
    }
    function areaOf(id) {
      const node = model.nodes[id];
      if (node.kind === 'area') return id;
      if (node.kind === 'concept') return model.nodes[node.section].area;
      return node.area;
    }
    function dot(id) {
      const mark = element('span', 'dot');
      mark.style.setProperty('--dot', colors[areaOf(id)] || '#a391ee');
      mark.setAttribute('aria-hidden', 'true');
      return mark;
    }
    function normalized(value) {
      return value.normalize('NFD').replace(/\p{M}/gu, '').toLocaleLowerCase('it');
    }
    const catalogue = entries.map(([id, node]) => ({
      id, title: normalized(node.title), paths: normalized([...node.sources, ...node.tests].join(' ')),
      text: normalized([node.summary, ...node.rules].join(' '))
    }));
    const graph = createMap(byId('map'), model, navigate, percent => {
      byId('zoom-level').textContent = percent + '%';
    });

    function hideSearch() {
      results.hidden = true;
      search.setAttribute('aria-expanded', 'false');
      search.removeAttribute('aria-activedescendant');
      matchIndex = -1;
    }
    function showSearch() {
      const query = normalized(search.value.trim());
      results.replaceChildren();
      hideSearch();
      if (!query) return;
      const words = query.split(/\s+/);
      const score = item => {
        if (query === item.id || query === item.title) return 10;
        if (item.title.startsWith(query) || item.id.startsWith(query)) return 8;
        if (item.title.includes(query) || item.id.includes(query)) return 6;
        if (item.paths.includes(query)) return 4;
        const all = [item.id, item.title, item.paths, item.text].join(' ');
        return words.every(w => all.includes(w)) ? 1 : 0;
      };
      const matches = catalogue.map(item => ({ id: item.id, score: score(item) }))
        .filter(match => match.score > 0).sort((a, b) => b.score - a.score);
      for (const { id } of matches) {
        const choice = nodeButton(id);
        choice.id = 'match-' + id;
        choice.setAttribute('role', 'option');
        choice.setAttribute('aria-selected', 'false');
        choice.tabIndex = -1;
        choice.append(element('small', '', id));
        results.append(choice);
      }
      if (!matches.length) results.append(element('p', 'none', 'Nessun nodo trovato. Prova con il nome di un modulo o di un file.'));
      results.hidden = false;
      search.setAttribute('aria-expanded', 'true');
    }
    function revealMatch(index) {
      const options = [...results.querySelectorAll('button')];
      if (!options.length) return;
      matchIndex = (index + options.length) % options.length;
      for (const [i, option] of options.entries()) option.setAttribute('aria-selected', i === matchIndex);
      search.setAttribute('aria-activedescendant', options[matchIndex].id);
      options[matchIndex].scrollIntoView({ block: 'nearest' });
    }
    function chooseMatch(id) {
      hideSearch();
      search.value = '';
      navigate(id);
      search.focus({ preventScroll: true });
    }

    function fileLink(file, label = file) {
      const a = element('a', 'file');
      const [path, anchor] = file.split('#');
      a.href = path.split('/').map(encodeURIComponent).join('/') + (anchor ? '#' + encodeURIComponent(anchor) : '');
      a.append(icon('file'), element('span', '', label));
      return a;
    }
    function section(title) {
      const block = element('section', 'detail-section');
      block.append(element('h3', '', title));
      detail.append(block);
      return block;
    }
    function references(title, files) {
      if (!files.length) return;
      const block = element('details', 'detail-section');
      block.open = files.length <= 4;
      block.append(element('summary', '', `${title} (${files.length})`));
      const refs = element('div', 'refs');
      for (const path of files) refs.append(fileLink(path));
      block.append(refs);
      detail.append(block);
    }
    function renderDetail(id) {
      const node = model.nodes[id];
      detail.replaceChildren();
      const kind = element('span', 'kind');
      kind.append(icon('layers'), names[node.kind]);
      const heading = element('h2', '', node.title);
      heading.tabIndex = -1;
      detail.append(kind, heading, element('p', 'summary', node.summary));
      const adjacent = model.edges.filter(e => e.from === id || e.to === id);
      const children = adjacent.filter(e => e.rel === 'contains' && e.from === id);
      const links = adjacent.filter(e => e.rel !== 'contains');
      function linked(block, other, relation = '') {
        const button = nodeButton(other, 'rel-link');
        button.replaceChildren();
        const label = element('span', '', model.nodes[other].title);
        if (relation) label.append(element('small', '', relation));
        button.append(dot(other), label, icon('chevron'));
        block.append(button);
      }
      if (children.length) {
        const title = { root: 'Aree del sistema', area: 'Capitoli', section: 'Concetti' }[node.kind];
        const block = section(title + ` (${children.length})`);
        for (const e of children) linked(block, e.to);
      }
      if (node.rules.length) {
        const rules = element('ul', 'rules');
        for (const rule of node.rules) rules.append(element('li', '', rule));
        section('Regole di sviluppo').append(rules);
      }
      if (links.length) {
        const block = section(`Relazioni (${links.length})`);
        for (const e of links) {
          const outgoing = e.from === id;
          const a = outgoing ? node.title : model.nodes[e.from].title;
          const b = outgoing ? model.nodes[e.to].title : node.title;
          linked(block, outgoing ? e.to : e.from, `${a} ${model.relations[e.rel]} ${b}`);
        }
      }
      const parent = adjacent.find(e => e.rel === 'contains' && e.to === id);
      if (parent) linked(section('Appartiene a'), parent.from);
      references('Sorgenti', node.sources);
      references('Test', node.tests);
      const chapter = node.kind === 'concept' ? model.nodes[node.section] : node;
      if (chapter.anchor) section('Guida').append(fileLink(model.guide + '#' + chapter.anchor, 'Leggi il capitolo in ELEPHANT.md'));
      detail.scrollTop = 0;
    }

    function buildList() {
      for (const [area, group] of entries.filter(([, node]) => node.kind === 'area')) {
        const block = element('section', 'list-group');
        const heading = nodeButton(area);
        const h3 = element('h3');
        h3.append(heading);
        block.append(h3);
        const buttons = element('div', 'list-buttons');
        for (const [id, chapter] of entries.filter(([, node]) => node.kind === 'section' && node.area === area)) {
          const item = nodeButton(id);
          item.title = `${group.title} / ${chapter.title}`;
          buttons.append(item);
          for (const [key] of entries.filter(([, node]) => node.section === id)) buttons.append(nodeButton(key));
        }
        block.append(buttons);
        list.append(block);
      }
    }
    function setView(asList) {
      byId('stage').hidden = asList;
      list.hidden = !asList;
      byId('graph-mode').setAttribute('aria-pressed', !asList);
      byId('list-mode').setAttribute('aria-pressed', asList);
      if (!asList) graph.resize();
    }
    function renderSteps() {
      steps.replaceChildren();
      model.entrypoints[route.value].steps.forEach((id, i) => {
        const li = element('li');
        if (i > 0) li.append(icon('arrow'));
        const button = nodeButton(id, 'step');
        button.prepend(element('span', 'ordinal', i + 1));
        button.setAttribute('aria-current', selected === id);
        li.append(button);
        steps.append(li);
      });
    }
    function select(id) {
      if (selected === id) return;
      const moveFocus = byId('map').contains(document.activeElement);
      selected = id;
      renderDetail(id);
      graph.show(id);
      byId('crumb-label').textContent = id === model.root ? 'Mappa del sistema' : model.nodes[id].title;
      byId('announcement').textContent = `Nodo selezionato. ${model.nodes[id].title}`;
      for (const button of document.querySelectorAll('#node-list [data-id], #steps [data-id], #legend [data-id]')) {
        button.setAttribute('aria-current', button.dataset.id === id);
      }
      if (moveFocus) {
        const next = byId('map').querySelector(`g[data-id="${CSS.escape(id)}"]`);
        (next || detail.querySelector('h2')).focus({ preventScroll: true });
      }
    }
    function fromHash() {
      const id = new URLSearchParams(location.hash.slice(1)).get('node');
      return Object.hasOwn(model.nodes, id) ? id : model.root;
    }
    function navigate(id) {
      if (!Object.hasOwn(model.nodes, id)) return;
      if (id !== selected) {
        location.hash = 'node=' + encodeURIComponent(id);
        select(id);
      }
    }

    for (const [id] of entries.filter(([, node]) => node.kind === 'area')) {
      const button = nodeButton(id, 'legend-item');
      button.prepend(dot(id));
      byId('legend').append(button);
    }
    byId('counts').append(element('span', '', `${entries.length} nodi totali`),
      element('span', '', `${model.edges.length} relazioni`));
    for (const [id, path] of Object.entries(model.entrypoints)) {
      const option = element('option', '', path.title);
      option.value = id;
      route.append(option);
    }
    buildList();
    renderSteps();
    select(fromHash());

    for (const host of [list, steps, detail, byId('legend')]) {
      host.addEventListener('click', event => {
        const button = event.target.closest('button[data-id]');
        if (button) navigate(button.dataset.id);
      });
    }
    results.addEventListener('click', event => {
      const choice = event.target.closest('button[data-id]');
      if (choice) chooseMatch(choice.dataset.id);
    });
    search.addEventListener('input', showSearch);
    search.addEventListener('focus', showSearch);
    search.addEventListener('keydown', event => {
      if (event.key === 'Escape') { hideSearch(); return; }
      if (results.hidden) return;
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        const dir = event.key === 'ArrowDown' ? 1 : -1;
        revealMatch(matchIndex < 0 && dir < 0 ? -1 : matchIndex + dir);
      } else if (event.key === 'Enter') {
        const choices = results.querySelectorAll('button');
        const choice = choices[Math.max(0, matchIndex)];
        if (choice) { event.preventDefault(); chooseMatch(choice.dataset.id); }
      }
    });
    document.addEventListener('pointerdown', event => {
      if (!byId('search-wrap').contains(event.target)) hideSearch();
    });
    byId('search-wrap').addEventListener('focusout', event => {
      if (!byId('search-wrap').contains(event.relatedTarget)) hideSearch();
    });
    document.addEventListener('keydown', event => {
      if (event.key === '/' && !event.ctrlKey && !event.metaKey && !event.altKey &&
          !event.target.closest('input,textarea,select,[contenteditable="true"]')) {
        event.preventDefault();
        search.focus();
      }
    });
    route.addEventListener('change', renderSteps);
    byId('list-mode').addEventListener('click', () => setView(true));
    byId('graph-mode').addEventListener('click', () => setView(false));
    // Anche da file:// il browser deve scaricare il modello, incluso in questa pagina.
    document.querySelector('a[download]').addEventListener('click', event => {
      event.preventDefault();
      const bytes = new Blob([JSON.stringify(model, null, 2), '\n'], { type: 'application/json' });
      const url = URL.createObjectURL(bytes);
      const link = element('a');
      link.href = url;
      link.download = 'ELEPHANT.json';
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    byId('zoom-in').addEventListener('click', () => graph.zoom(1.25));
    byId('zoom-out').addEventListener('click', () => graph.zoom(1 / 1.25));
    byId('fit').addEventListener('click', () => graph.fit());
    function overview() {
      setView(false);
      navigate(model.root);
      graph.fit();
    }
    byId('root-reset').addEventListener('click', overview);
    byId('detail-jump').addEventListener('click', () => {
      const heading = detail.querySelector('h2');
      heading.focus({ preventScroll: true });
      heading.scrollIntoView({ block: 'start' });
    });
    byId('brand').addEventListener('click', overview);
    window.addEventListener('hashchange', () => select(fromHash()));
    new ResizeObserver(() => { if (!byId('stage').hidden) graph.resize(); }).observe(byId('stage'));
  </script>
</body>
</html>
