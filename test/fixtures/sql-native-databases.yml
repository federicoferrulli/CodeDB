name: codedb-sql-test
services:
  postgres:
    image: postgres:18
    labels: { codedb.test: '1' }
    environment: { POSTGRES_HOST_AUTH_METHOD: trust }
    ports: ['127.0.0.1:55439:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 60
  mysql:
    image: mysql:8.4
    labels: { codedb.test: '1' }
    environment: { MYSQL_ALLOW_EMPTY_PASSWORD: 'yes', MYSQL_ROOT_HOST: '%' }
    ports: ['127.0.0.1:33339:3306']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root']
      interval: 2s
      timeout: 5s
      retries: 60
  mongo1:
    image: mongo:8.0
    container_name: codedb-sql-node-27039
    labels: { codedb.test: sql-replica }
    command: ['mongod', '--port', '27039', '--bind_ip_all', '--replSet', 'codedbtest', '--setParameter', 'enableTestCommands=1']
    ports: ['127.0.0.1:27039:27039']
  mongo2:
    image: mongo:8.0
    container_name: codedb-sql-node-27040
    labels: { codedb.test: sql-replica }
    command: ['mongod', '--port', '27040', '--bind_ip_all', '--replSet', 'codedbtest', '--setParameter', 'enableTestCommands=1']
    ports: ['127.0.0.1:27040:27040']
  mongo3:
    image: mongo:8.0
    container_name: codedb-sql-node-27041
    labels: { codedb.test: sql-replica }
    command: ['mongod', '--port', '27041', '--bind_ip_all', '--replSet', 'codedbtest', '--setParameter', 'enableTestCommands=1']
    ports: ['127.0.0.1:27041:27041']
