# Firma nei job nativi; un solo job finale prepara la bozza, mai pubblicata automaticamente.
name: Build e release
on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      pubblica:
        description: 'Prepara la bozza multipiattaforma (firma Windows opzionale, pubblicazione manuale)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Le due forme del tag e l'avvio manuale non devono modificare la stessa bozza in parallelo.
  group: codedb-release
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  verifica:
    name: Test, frontend e versione
    runs-on: ubuntu-24.04
    outputs:
      pubblica: ${{ steps.versione.outputs.pubblica }}
      versione: ${{ steps.versione.outputs.versione }}
      android-code: ${{ steps.versione.outputs.android_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Versione, tag e codice Android
        id: versione
        env:
          PUBBLICA: ${{ github.event_name == 'push' || inputs.pubblica == true }}
          ANDROID_VERSION_CODE_BASE: ${{ vars.ANDROID_VERSION_CODE_BASE || '0' }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { versione } = require('./tools/firma.cjs');
          const v = require('./package.json').version;
          const tag = process.env.GITHUB_REF.startsWith('refs/tags/') ? process.env.GITHUB_REF.slice(10) : null;
          versione(v, tag);
          const chosen = tag || `v${v}`;
          const tags = require('child_process').execFileSync('git', ['tag', '--list'], {encoding:'utf8'}).trim().split('\n');
          if (tags.some(t => t !== chosen && t.replace(/^v/i, '').toLowerCase() === v.toLowerCase())) throw Error('Tag duplicati per la stessa versione: risolverli prima della release.');
          if (!/^\d+$/.test(process.env.ANDROID_VERSION_CODE_BASE)) throw Error('ANDROID_VERSION_CODE_BASE deve essere un intero non negativo.');
          const code = Number(process.env.ANDROID_VERSION_CODE_BASE) + Number(process.env.GITHUB_RUN_NUMBER);
          if (!Number.isSafeInteger(code) || code < 1 || code > 2100000000) throw Error('versionCode Android fuori intervallo.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `versione=${v}\npubblica=${process.env.PUBBLICA}\nandroid_code=${code}\n`);
          NODE
      - run: npm test
      - run: npm run build:ui
      - run: npm run typecheck:ui
      - run: npx --no-install playwright install --with-deps chromium
      - name: Safe area web
        run: node test/e2e-safe-area.js

  integrita:
    name: Prerequisiti GPG e prova crittografica
    needs: verifica
    runs-on: ubuntu-24.04
    environment: ${{ needs.verifica.outputs.pubblica == 'true' && 'release' || 'build-test' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Validazione anticipata della policy GPG
        if: needs.verifica.outputs.pubblica == 'true'
        run: node tools/firma.cjs gpg --release
        env:
          CODEDB_REQUIRE_GPG: ${{ vars.CODEDB_REQUIRE_GPG || 'false' }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_FINGERPRINT: ${{ vars.GPG_KEY_FINGERPRINT }}
      - run: node test/unit-release-gpg.cjs

  windows:
    name: Windows NSIS x64
    needs: [verifica, integrita]
    runs-on: windows-2022
    environment: ${{ needs.verifica.outputs.pubblica == 'true' && 'release' || 'build-test' }}
    permissions:
      contents: read
      id-token: write
    env:
      CODEDB_RELEASE: ${{ needs.verifica.outputs.pubblica }}
      CODEDB_BUILD_ARCH: x64
      CODEDB_WINDOWS_SIGNING: ${{ needs.verifica.outputs.pubblica == 'true' && vars.CODEDB_WINDOWS_SIGNING || 'unsigned' }}
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Prerequisiti Azure
        if: env.CODEDB_WINDOWS_SIGNING == 'azure'
        run: node tools/firma.cjs win --release
        env:
          AZURE_CODE_SIGNING_ENDPOINT: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Accesso federato Azure
        if: env.CODEDB_WINDOWS_SIGNING == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build firmata con timestamp
        if: env.CODEDB_WINDOWS_SIGNING == 'azure'
        run: npm run release:win
        env:
          AZURE_CODE_SIGNING_ENDPOINT: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Installer indipendente senza certificati
        if: env.CODEDB_WINDOWS_SIGNING != 'azure'
        run: npm run build:win
      - name: Verifica firme PE e installer
        if: env.CODEDB_WINDOWS_SIGNING == 'azure'
        run: ./tools/verifica-firma-win.ps1
        env:
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
      - name: Avvio del pacchetto e moduli nativi
        run: node test/e2e-release-desktop.cjs dist/win-unpacked/CodeDB.exe
      - run: node tools/release-assets.cjs stage dist staged/win win
      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: staged/win/*
          if-no-files-found: error
          retention-days: 14

  mac:
    name: macOS ${{ matrix.arch }} DMG e ZIP
    needs: [verifica, integrita]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            app: dist/mac/CodeDB.app/Contents/MacOS/CodeDB
          - os: macos-15
            arch: arm64
            app: dist/mac-arm64/CodeDB.app/Contents/MacOS/CodeDB
    runs-on: ${{ matrix.os }}
    environment: ${{ needs.verifica.outputs.pubblica == 'true' && 'release' || 'build-test' }}
    env:
      CODEDB_RELEASE: ${{ needs.verifica.outputs.pubblica }}
      CODEDB_BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Xcode e directory temporanea
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          plutil -lint build/entitlements.mac.plist build/entitlements.mac.inherit.plist
          mkdir -p "$RUNNER_TEMP/codedb-signing"
          echo "APP_BUILDER_TMP_DIR=$RUNNER_TEMP/codedb-signing" >> "$GITHUB_ENV"
      - name: Prerequisiti Apple
        if: needs.verifica.outputs.pubblica == 'true'
        run: node tools/firma.cjs mac --release
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      - name: Firma Developer ID e notarizzazione integrata
        if: needs.verifica.outputs.pubblica == 'true'
        run: npm run release:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      - name: Build ad hoc senza credenziali Apple
        if: needs.verifica.outputs.pubblica != 'true'
        run: npm run build:mac
      - name: Firma e Gatekeeper sugli archivi definitivi
        if: needs.verifica.outputs.pubblica == 'true'
        run: bash tools/verifica-firma-mac.sh dist
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      - name: Avvio del pacchetto e moduli nativi
        run: node test/e2e-release-desktop.cjs '${{ matrix.app }}'
      - run: node tools/release-assets.cjs stage dist staged/mac-${{ matrix.arch }} mac-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: staged/mac-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Elimina portachiavi e certificati temporanei anche dopo errori
        if: always()
        run: |
          if [ -d "$APP_BUILDER_TMP_DIR" ]; then
            find "$APP_BUILDER_TMP_DIR" -name '*.keychain*' -type f -exec security delete-keychain {} \;
            rm -rf "$APP_BUILDER_TMP_DIR"
          fi

  linux:
    name: Linux x64 AppImage DEB RPM
    needs: [verifica, integrita]
    runs-on: ubuntu-24.04
    env:
      CODEDB_RELEASE: ${{ needs.verifica.outputs.pubblica }}
      CODEDB_BUILD_ARCH: x64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Librerie native e strumenti RPM
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev rpm libarchive-tools libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64 xvfb
      - run: npm ci
      - run: npm run build:linux
      - name: Verifica contenitori e avvio AppImage estratta
        run: |
          rpm -K dist/*.rpm
          rpm -qp --queryformat '%{NAME} %{VERSION} %{ARCH}\n' dist/*.rpm
          dpkg-deb --info dist/*.deb
          chmod +x dist/*.AppImage
          cd dist
          ./*.AppImage --appimage-extract >/dev/null
          cd ..
          sudo chown root:root dist/squashfs-root/chrome-sandbox
          sudo chmod 4755 dist/squashfs-root/chrome-sandbox
          xvfb-run -a node test/e2e-release-desktop.cjs dist/squashfs-root/codedb
      - run: node tools/release-assets.cjs stage dist staged/linux linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: staged/linux/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android autonomo APK e AAB
    needs: [verifica, integrita]
    runs-on: ubuntu-24.04
    environment: ${{ needs.verifica.outputs.pubblica == 'true' && 'release' || 'build-test' }}
    env:
      CODEDB_RELEASE: ${{ needs.verifica.outputs.pubblica }}
      ANDROID_VERSION_CODE: ${{ needs.verifica.outputs.android-code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Il vecchio pacchetto tools non è più disponibile nel catalogo SDK.
          packages: platform-tools
          cmdline-tools-version: '12266719'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - run: npm ci
      - name: SDK e compilatore Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepara firma persistente fuori dal checkout
        if: needs.verifica.outputs.pubblica == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/codedb.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node tools/firma.cjs android --release --senza-file
          node -e "const fs=require('fs');const s=process.env.ANDROID_KEYSTORE_BASE64;if(!s || !/^[A-Za-z0-9+/=\s]+$/.test(s))throw Error('ANDROID_KEYSTORE_BASE64 mancante o non valido');fs.writeFileSync(process.env.ANDROID_KEYSTORE_PATH,Buffer.from(s,'base64'),{mode:0o600,flag:'wx'});"
          node tools/firma.cjs android --release
      - run: npm run prepare:android
      - name: Node della prova runtime mobile
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.4'
      - run: node android/test.cjs
      - run: node android/test-moduli.cjs
      - name: APK e AAB di distribuzione, lint e verifica delle due firme
        if: needs.verifica.outputs.pubblica == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/codedb.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSIONE: ${{ needs.verifica.outputs.versione }}
        run: |
          gradle --no-daemon -p android assembleRelease bundleRelease lintRelease
          bash tools/verifica-firma-android.sh
          node android/test.cjs android/app/build/outputs/bundle/release/app-release.aab
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/CodeDB-$VERSIONE-android.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/CodeDB-$VERSIONE-android.aab"
      - name: APK debug installabile senza credenziali
        if: needs.verifica.outputs.pubblica != 'true'
        env:
          VERSIONE: ${{ needs.verifica.outputs.versione }}
        run: |
          gradle --no-daemon -p android assembleDebug lintDebug
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/CodeDB-$VERSIONE-android-debug.apk"
      - run: node android/test.cjs dist/*.apk
      - name: Abilita accelerazione emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Avvio autonomo e inset su emulatore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon -p android connectedDebugAndroidTest
      - run: node tools/release-assets.cjs stage dist staged/android android
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: staged/android/*
          if-no-files-found: error
          retention-days: 14
      - name: Rapporti Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapporti-android
          path: android/app/build/reports/
      - name: Rimuovi sempre il keystore temporaneo
        if: always()
        run: rm -f "$RUNNER_TEMP/codedb.jks"

  raccogli:
    name: Asset definitivi e checksum globali
    needs: [verifica, windows, mac, linux, android]
    runs-on: ubuntu-24.04
    environment: ${{ needs.verifica.outputs.pubblica == 'true' && 'release' || 'build-test' }}
    env:
      CODEDB_RELEASE: ${{ needs.verifica.outputs.pubblica }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: '{win,mac-x64,mac-arm64,linux,android}'
          path: incoming
      - name: Raccogli senza firma GPG nelle prove
        if: needs.verifica.outputs.pubblica != 'true'
        run: node tools/release-assets.cjs raccogli incoming release-assets
      - name: Manifest e firma GPG opzionale o obbligatoria
        if: needs.verifica.outputs.pubblica == 'true'
        run: node tools/release-assets.cjs raccogli incoming release-assets
        env:
          CODEDB_REQUIRE_GPG: ${{ vars.CODEDB_REQUIRE_GPG || 'false' }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_FINGERPRINT: ${{ vars.GPG_KEY_FINGERPRINT }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-completa
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  bozza:
    name: Unica bozza completa, pubblicazione manuale
    needs: [verifica, raccogli]
    if: needs.verifica.outputs.pubblica == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-completa
          path: release-assets
      - name: Riconcilia e verifica la bozza sul server
        run: node tools/pubblica-bozza.cjs release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEDB_REQUIRE_GPG: ${{ vars.CODEDB_REQUIRE_GPG || 'false' }}
          GPG_KEY_FINGERPRINT: ${{ vars.GPG_KEY_FINGERPRINT }}
